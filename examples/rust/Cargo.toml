[package]
name = "ccxt-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# `ccxt` is the typed API crate; it re-exports the whole `ccxt-base` engine at
# its root, so `ccxt::Value` etc. resolve here alongside the typed `ccxt::Binance`.
ccxt = { path = "../../rust/ccxt" }
# The transpiled pro/ WebSocket venues live in their own crate. Optional so the
# default examples build (and CI) stays on the lighter set.
ccxt-pro = { path = "../../rust/ccxt-pro", optional = true }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

[features]
# Opt-in: pulls in the transpiled pro/ WebSocket venue crate (`ccxt-pro`). Only
# the watch*/probe bins need it, so the default `cargo build --bins` (and CI)
# stays on the lighter transpiled-base set.
ws = ["dep:ccxt-pro"]

[[bin]]
name = "binance_basics"
path = "src/binance_basics.rs"

[[bin]]
name = "exchanges_smoke"
path = "src/exchanges_smoke.rs"

[[bin]]
name = "cli"
path = "src/cli.rs"

[[bin]]
name = "bench_parse_markets"
path = "src/bench_parse_markets.rs"

[[bin]]
name = "binance_typed"
path = "src/binance_typed.rs"

[[bin]]
name = "orderbook_diff"
path = "src/orderbook_diff.rs"

# WebSocket cross-exchange order-book comparison. Gated behind `ws` so the
# default examples build doesn't compile the pro venues.
[[bin]]
name = "watch_orderbook_compare"
path = "src/watch_orderbook_compare.rs"
required-features = ["ws"]

[[bin]]
name = "ws_health_probe"
path = "src/ws_health_probe.rs"
required-features = ["ws"]

[[bin]]
name = "watch_trades_count"
path = "src/watch_trades_count.rs"
required-features = ["ws"]

# Keep debug symbols in release so `sample`/Instruments can attribute
# hot frames. Negligible perf impact, larger binary.
[profile.release]
debug = true

# The examples recompile the whole `ccxt` crate from scratch (a separate
# manifest, so no artifact reuse from the workspace build). Drop debug info in
# the default dev profile — for a ~100-exchange generated crate, debuginfo
# generation is a large share of compile time and memory, and these examples
# are smoke/CLI programs that don't need it. Keeps the CI examples step well
# under the job timeout.
[profile.dev]
debug = 0

[[bin]]
name = "iexchange_demo"
path = "src/iexchange_demo.rs"
