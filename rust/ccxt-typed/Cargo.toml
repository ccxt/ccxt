[package]
name = "ccxt-typed"
version = "0.1.0"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – typed unified-method wrappers"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt-typed"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt_typed"
path = "src/lib.rs"

[dependencies]
# The base crate. The per-exchange typed wrappers wrap the REST/prediction Cores
# and the base method surface that live in `ccxt`. Splitting the typed layer
# into its own crate keeps the base `ccxt` rustc invocation under the CI
# runner's memory ceiling (the wrappers add ~1 GB of monomorphised code).
ccxt = { path = "../ccxt", features = ["transpiled-base"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rust_decimal = { version = "1", features = ["serde-str"] }
num-bigint = "0.4"
num-traits = "0.2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
