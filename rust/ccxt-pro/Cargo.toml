deribit = ["ccxt-base/deribit"]
derive = ["ccxt-base/derive"]
dydx = ["ccxt-base/dydx"]
extended = ["ccxt-base/extended"]
gate = ["ccxt-base/gate"]
gateeu = ["ccxt-base/gateeu", "gate"]
gemini = ["ccxt-base/gemini"]
grvt = ["ccxt-base/grvt"]
hashkey = ["ccxt-base/hashkey"]
hitbtc = ["ccxt-base/hitbtc"]
hollaex = ["ccxt-base/hollaex"]
htx = ["ccxt-base/htx"]
hyperliquid = ["ccxt-base/hyperliquid"]
independentreserve = ["ccxt-base/independentreserve"]
kraken = ["ccxt-base/kraken"]
krakenfutures = ["ccxt-base/krakenfutures"]
kucoin = ["ccxt-base/kucoin"]
kucoinfutures = ["ccxt-base/kucoinfutures", "kucoin"]
lbank = ["ccxt-base/lbank"]
lighter = ["ccxt-base/lighter"]
luno = ["ccxt-base/luno"]
mexc = ["ccxt-base/mexc"]
modetrade = ["ccxt-base/modetrade"]
