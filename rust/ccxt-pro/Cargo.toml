bitrue = ["ccxt-base/bitrue"]
bitstamp = ["ccxt-base/bitstamp"]
bittrade = ["ccxt-base/bittrade"]
bitvavo = ["ccxt-base/bitvavo"]
blockchaincom = ["ccxt-base/blockchaincom"]
blofin = ["ccxt-base/blofin"]
bullish = ["ccxt-base/bullish"]
bybit = ["ccxt-base/bybit"]
bybiteu = ["ccxt-base/bybiteu", "bybit"]
bybitid = ["ccxt-base/bybitid", "bybit"]
bydfi = ["ccxt-base/bydfi"]
cex = ["ccxt-base/cex"]
coinbase = ["ccxt-base/coinbase"]
coinbaseexchange = ["ccxt-base/coinbaseexchange"]
coinbaseinternational = ["ccxt-base/coinbaseinternational"]
coincheck = ["ccxt-base/coincheck"]
coinex = ["ccxt-base/coinex"]
coinone = ["ccxt-base/coinone"]
