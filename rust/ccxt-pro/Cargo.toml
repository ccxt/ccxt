[package]
name = "ccxt-pro"
version = "0.1.0"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – pro (WebSocket / watch*) exchanges"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt-pro"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt_pro"
path = "src/lib.rs"

[dependencies]
# The base crate. The transpiled WS venues in `src/pro/<id>.rs` reference the
# REST cores, runtime helpers and hand-written pro infra (cache / order_book /
# ws_client) that live in `ccxt`. Splitting the WS venues into their own crate
# keeps each `rustc` invocation well under the CI runner's memory limit.
ccxt = { path = "../ccxt", features = ["transpiled-base"] }

# HTTP client (async) — some venues sign REST sub-requests directly.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks", "gzip"], default-features = false }
# Async runtime
tokio = { version = "1", features = ["full"] }
# JSON serialisation / deserialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# HMAC / SHA / MD5 / crypto primitives
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
rmp-serde = "1"
rmpv = "1"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
urlencoding = "2"
form_urlencoded = "1"
url = "2"
rust_decimal = { version = "1", features = ["serde-str"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
ed25519-dalek = "2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
flate2 = "1"
once_cell = "1"
