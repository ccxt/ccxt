[package]
name = "ccxt-pro"
version = "4.5.83"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – pro (WebSocket / watch*) exchanges"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt-pro"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt_pro"
path = "src/lib.rs"

[features]
# `all` (the default) keeps today's behaviour: every WebSocket venue compiles.
# Pick venues instead to cut build time and memory by two orders of magnitude:
#   ccxt = { version = "…", default-features = false, features = ["binance", "kraken"] }
default = ["all"]
# BEGIN GENERATED FEATURES (emitted by build/generateRustWrappers.ts)
alpaca = ["ccxt-base/alpaca"]
apex = ["ccxt-base/apex"]
aster = ["ccxt-base/aster"]
backpack = ["ccxt-base/backpack"]
bequant = ["ccxt-base/bequant", "hitbtc"]
binance = ["ccxt-base/binance"]
binancecoinm = ["ccxt-base/binancecoinm", "binance"]
binanceus = ["ccxt-base/binanceus", "binance"]
binanceusdm = ["ccxt-base/binanceusdm", "binance"]
bingx = ["ccxt-base/bingx"]
bitfinex = ["ccxt-base/bitfinex"]
