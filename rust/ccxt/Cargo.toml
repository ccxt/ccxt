[package]
name = "ccxt"
version = "4.5.83"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – typed unified-method API (re-exports the ccxt-base engine)"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt"
path = "src/lib.rs"

[features]
# `all` (the default) keeps today's behaviour: every REST venue compiles.
# Pick venues instead to cut build time and memory by two orders of magnitude:
#   ccxt = { version = "…", default-features = false, features = ["binance", "kraken"] }
default = ["all"]
