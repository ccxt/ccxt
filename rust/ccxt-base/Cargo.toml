[package]
name = "ccxt-base"
version = "4.5.75"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – untyped engine (runtime, Value, REST/prediction Cores, WS infra)"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt-base"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt_base"
path = "src/lib.rs"

[features]
default = []
# Includes the transpiled-from-Exchange.ts REST + prediction Cores and the
# base method surface. Compiles and passes the offline static request/response
# and base suites (see the crate README for the supported matrix).
#
# The transpiled WebSocket (`pro`) venues and the typed unified-method wrappers
# used to live behind features here; they were split into the sibling
# `ccxt-pro` and `ccxt-typed` crates so no single `rustc` invocation holds the
# whole generated surface at once (it OOM'd the 16 GB CI runner). Depend on
# those crates directly instead of enabling a feature.
transpiled-base = []

[dependencies]
# HTTP client (async)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks", "gzip"], default-features = false }
# Async runtime
tokio = { version = "1", features = ["full"] }
# JSON serialisation / deserialisation
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` an `IndexMap`-backed type so
# `Value::to_json` keeps Value::Map's insertion order through to the
# `serde_json::to_string` boundary (without this, exchange URL/JSON
# payloads come out alphabetised and break static request fixtures
# that assert specific key orders).
# `float_roundtrip` swaps in the lexical-core float parser so JSON
# numbers like `7.5562000000000005` round-trip to the same f64 they
# came from — without it, serde_json's default float parser silently
# loses one ULP and static response fixtures fail on parser-precise
# values (bingx, arkham vwap, …).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# HMAC / SHA / MD5 / crypto primitives
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# Keccak-256 (ETH hashing)
sha3 = "0.10"
# secp256k1 ECDSA with public-key recovery (ETH signing)
k256 = { version = "0.13", features = ["ecdsa"] }
# MessagePack (hyperliquid L1 action hashing)
rmp-serde = "1"
rmpv = "1"
# RSA signing (jwt RS256, exchange rsa())
rsa = { version = "0.9", features = ["sha2"] }
# Base64
base64 = "0.22"
# URL encoding
urlencoding = "2"
form_urlencoded = "1"
# URL parsing
url = "2"
# Precise decimal arithmetic (mirrors CCXT's Precise class)
rust_decimal = { version = "1", features = ["serde-str"] }
# Arbitrary-precision integers — used by Precise's div/mul fallback when
# operands exceed i128 (CCXT fixtures carry full-precision float expansions
# with 40+ significant digits; TS uses BigInt, so we must too to match).
num-bigint = "0.4"
num-traits = "0.2"
# Cryptographic RNG
rand = "0.8"
# Hex encoding / decoding
hex = "0.4"
# Time utilities
chrono = { version = "0.4", features = ["serde"] }
# Async trait support
async-trait = "0.1"
# Futures utilities
futures = "0.3"
# Error handling
thiserror = "1"
# Thread-safe reference counted pointers (used for derived_describe callback)
parking_lot = "0.12"
# Insertion-order-preserving map. Used as Value::Map's backing store so
# that JSON / URL-encoded payloads serialize keys in the order exchanges
# expect (bingx/digifinex/mexc createOrders fixtures assert specific
# orderings).
indexmap = { version = "2", features = ["serde"] }
ed25519-dalek = "2"
# WebSocket transport for the pro (watch*) API. rustls stack to match reqwest
# (no OpenSSL). `connect_async` handles ws:// and wss://.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# gzip / raw-inflate for venues that compress WS frames (htx, bitmart, …).
flate2 = "1"
# Global lazy statics for the WS client registry.
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
