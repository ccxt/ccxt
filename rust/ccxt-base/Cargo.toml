[package]
name = "ccxt-base"
version = "4.5.85"
edition = "2021"
description = "CCXT – CryptoCurrency eXchange Trading Library (Rust) – untyped engine (runtime, Value, REST/prediction Cores, WS infra)"
license = "MIT"
repository = "https://github.com/ccxt/ccxt"
homepage = "https://ccxt.com"
documentation = "https://docs.rs/ccxt-base"
readme = "README.md"
keywords = ["cryptocurrency", "exchange", "trading", "bitcoin", "ccxt"]
categories = ["api-bindings", "asynchronous", "finance"]

[lib]
name = "ccxt_base"
path = "src/lib.rs"

[features]
default = []
# Includes the transpiled-from-Exchange.ts REST + prediction Cores and the
# base method surface. Compiles and passes the offline static request/response
# and base suites (see the crate README for the supported matrix).
#
# The transpiled WebSocket (`pro`) venues and the typed unified-method wrappers
# used to live behind features here; they were split into the sibling
# `ccxt-pro` and `ccxt-typed` crates so no single `rustc` invocation holds the
# whole generated surface at once (it OOM'd the 16 GB CI runner). Depend on
# those crates directly instead of enabling a feature.
#
# `transpiled-base` = the whole surface (engine + every REST and prediction
# Core), unchanged for existing users and CI. `engine` is the base method
# surface alone; the sibling `ccxt` / `ccxt-pro` / `ccxt-prediction` crates
# enable it plus one per-exchange feature per venue the user asked for, so
# `ccxt = { default-features = false, features = ["binance"] }` compiles a
# single Core instead of all 200+.
transpiled-base = ["engine", "all-exchanges", "all-prediction"]
engine = ["ccxt-core/engine"]
# One feature per transpiled Core, emitted by build/generateRustWrappers.ts; a
# derived venue lists its parent so the parent Core compiles too. Prediction
# Cores are prefixed `prediction-` because their ids overlap the REST venues.
# BEGIN GENERATED FEATURES
