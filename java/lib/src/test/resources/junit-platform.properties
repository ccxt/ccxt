# Run test classes concurrently in one JVM; methods inside a class stay sequential.
# The suite is dominated by real-time waits (throttler, executor grace periods),
# so classes overlap instead of queueing. Classes touching JVM-global state use @Isolated.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=8
junit.jupiter.execution.parallel.config.fixed.max-pool-size=64
