# The reverse-proxy config for the order router, as it actually runs.
#
# This is an INCLUDE, not a server block. The router does not own a hostname: it lives under
# docs.ccxt.com, on a VM whose nginx also fronts CCXT's own site and two other deploy pipelines.
# TLS, listen, server_name and the certificate paths belong to that shared server block and are
# deliberately not repeated here — a second `listen 443 ssl` for the same host is a config error,
# and copying the cert paths into a per-service file is how they go stale after a renewal.
#
#   /etc/nginx/sites-available/docs.ccxt.com:
#       server {
#           listen 443 ssl http2;
#           server_name docs.ccxt.com;
#           ssl_certificate     /etc/letsencrypt/live/docs.ccxt.com/fullchain.pem;
#           ssl_certificate_key /etc/letsencrypt/live/docs.ccxt.com/privkey.pem;
#           include /etc/nginx/snippets/order-router.conf;   # <- this file
#           location / { ... ccxt-fumadocs ... }
#       }
#
# Install: cp to /etc/nginx/snippets/order-router.conf, add the include line and the two upstream
# blocks below to http {}, then `nginx -t && systemctl reload nginx`. Because the file is shared
# with two other pipelines, `nginx -t` failing here takes THEM down too: test before reloading,
# every time.
#
# Path layout, per docs/product-plan.md §2:
#   docs.ccxt.com/router/      -> console: homepage, docs, signup, login, dashboard, /router/admin
#   docs.ccxt.com/router/api/  -> the public API (/route, /orderbook, /metrics, /health, ...)
#
# The two are proxied differently and the difference is easy to get backwards. The console serves
# its OWN `/router` prefix (ORDER_ROUTER_WEB_BASE), so its proxy_pass carries no URI part and the
# path goes through unchanged. The API is mounted at the ROOT of its process, so its proxy_pass
# ends in `/` and nginx strips `/router/api` before forwarding. Swap them and every console link
# 404s while every API route resolves one segment deep.

# ---- upstreams (http {} scope, not inside server {}) --------------------------------------------
# upstream order_router     { server 127.0.0.1:8080; keepalive 16; }
# upstream order_router_web { server 127.0.0.1:8090; keepalive 8; }

# The API's own /route rate limit is per KEY. This one is per IP, in front of it, and its job is
# the traffic that never presents a key at all — an unauthenticated flood costs the router a
# rate-limiter lookup per request today. burst tolerates a client's normal bunching; nodelay means
# a burst is served immediately rather than queued into latency.
# limit_req_zone $binary_remote_addr zone=order_router_api:10m rate=20r/s;


# ---- readiness gate -----------------------------------------------------------------------------
# A restart rebuilds the whole order-book cache, and for the minutes that takes the process holds
# some venues and not others. The app now refuses to rank a route in that state (503 cache_cold),
# but nginx should not have forwarded the request in the first place: with a second instance behind
# this upstream, a cold one must be taken OUT OF ROTATION rather than served through.
#
# nginx OSS has no active health checks (that is nginx Plus), so the gate is an auth_request
# subrequest against the app's own /ready. It is a loopback request on a keepalive connection to a
# handler that reads two counters — microseconds, and it is the same predicate /route itself uses,
# so the two cannot disagree.
#
# auth_request's status mapping is the awkward part and the reason for the error_page below: it
# allows on 2xx, propagates 401/403, and turns EVERYTHING ELSE — including the 503 /ready answers
# while cold — into a 500. So the 500 is caught and re-shaped into the same 503 body the app would
# have returned. This only catches nginx's own 500: proxy_intercept_errors is off by default, so a
# genuine 500 from the app is passed through untouched.
location = /_router_ready_gate {
    internal;
    proxy_pass http://order_router/ready;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}

location @router_cache_cold {
    default_type application/json;
    add_header Retry-After 1 always;
    return 503 '{"error":"the order book cache is still warming up; no route can be ranked yet","reason":"cache_cold"}';
}

# The probes themselves must never be gated on the probe. /ready has to be able to say "not ready",
# /health has to answer during a warm-up, and /metrics is the one thing an operator is watching in
# exactly that window. They are exact-match locations, so they win over the prefix locations below
# regardless of order; the header set is deliberately minimal rather than a third copy of the block
# below, because none of the three reads a body or an upgrade.
location = /router/api/health  { auth_request off; proxy_pass http://order_router/health;  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location = /router/api/ready   { auth_request off; proxy_pass http://order_router/ready;   proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location = /router/api/metrics { auth_request off; proxy_pass http://order_router/metrics; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

# ---- WS stream: longest-prefix match, so this wins over /router/api/ below ----------------------
location /router/api/stream/ {
    # A socket accepted while the cache is cold lives for minutes and carries no status codes once
    # open, so gating the UPGRADE is the only place this can be caught from outside the app.
    auth_request /_router_ready_gate;
    error_page 500 = @router_cache_cold;
    proxy_pass http://order_router/stream/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    # $proxy_add_x_forwarded_for APPENDS the real peer to whatever arrived; it does not trust the
    # client's value. ORDER_ROUTER_TRUST_PROXY=1 then walks back exactly one entry from the right,
    # landing on the address nginx observed.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MUST exceed ORDER_ROUTER_WS_IDLE_TIMEOUT_MS (30s in env.example) or nginx reaps the socket
    # before the app's heartbeat proves it alive. This bug hides on liquid pairs — a busy book keeps
    # the connection full of real data — and only shows on quiet symbols, as a stream that drops
    # about once a minute for no logged reason.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

# ---- the public API ----------------------------------------------------------------------------
location /router/api/ {
    # limit_req zone=order_router_api burst=40 nodelay;
    auth_request /_router_ready_gate;
    error_page 500 = @router_cache_cold;
    proxy_pass http://order_router/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # /route answers from in-memory maps in ~300us; anything near this timeout is a hung upstream,
    # not a slow one.
    proxy_read_timeout 30s;
}

# Without this, `curl https://docs.ccxt.com/router/api` (no trailing slash) falls through to the
# docs site's `location /` and returns CCXT's 404 page, which reads exactly like a dead router.
location = /router/api {
    return 308 /router/api/;
}

# ---- the console -------------------------------------------------------------------------------
# No URI part on proxy_pass: the app serves /router/... itself.
location /router/ {
    proxy_pass http://order_router_web;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
}

location = /router {
    return 308 /router/;
}

# ---- what is deliberately NOT here --------------------------------------------------------------
#
# There is no IP allowlist on /router/api/metrics. An earlier version of the README suggested one
# (`allow 10.0.0.0/8; deny all;`), and it cannot be used as written: /metrics is authenticated like
# every other non-/health route, the CI live-integration job asserts against it from GitHub-hosted
# runners with no fixed egress range, and there is no scraper network on this box to allow. The key
# requirement is the access control. If a scraper ever runs off-box from a stable address, add the
# allowlist THEN — an allowlist that has to be widened to `0.0.0.0/0` on the first incident is worse
# than none, because it reads like protection.
#
# There WAS no `location = /router/api/health` exemption, on the grounds that a separate location
# duplicates the header set in a place nobody updates. The readiness gate forced the issue: /health,
# /ready and /metrics have to answer while the gate is refusing everything else, so the three now
# have exact-match locations above. The duplication is real and is the price of the gate; keep them
# minimal so there is little to drift.
