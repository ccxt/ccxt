<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCXT positions</title>
<style>
/* @include shared.css */
/* the account this data belongs to, and the one thing that must never be misread: whether
   it is real. LIVE is a solid inverted pill, the practice environments an outline — told
   apart by the word and the form, not by a colour */
.account { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.account .name { font-weight: 600; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env { flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; line-height: 16px; padding: 0 7px; border: 1px solid var(--text-2); border-radius: 999px; color: var(--text-2); white-space: nowrap; }
.env.live { background: var(--text); border-color: var(--text); color: var(--bg); }
.asof { color: var(--text-2); margin-top: 2px; }
.hero .value { font-variant-numeric: normal; overflow-wrap: anywhere; }
/* sits under the table: its height may change with the row, and rows must not move under the pointer */
.readout { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 2px 14px; min-height: 20px; margin: 8px 0 0; color: var(--text-2); font-variant-numeric: tabular-nums; }
.readout > span { min-width: 0; overflow-wrap: anywhere; }
.readout b { color: var(--text); font-weight: 600; }
.readout .sym { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { color: var(--text-2); margin-top: 6px; }
.board.scroll { max-height: 520px; }
th, td { padding: 6px 7px; }
thead th { padding: 5px 7px; }
thead button { border: 0; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; color: inherit; font-weight: inherit; white-space: nowrap; }
thead th[aria-sort="ascending"] button, thead th[aria-sort="descending"] button { color: var(--text); font-weight: 600; }
thead .dir { display: inline-block; width: 1em; text-align: center; }
tbody tr:hover, tbody tr.active { background: var(--bg-2); }
tbody tr:focus-visible { outline-offset: -2px; }
tbody th { font-weight: 600; border-bottom: 1px solid var(--border); }
tbody tr:last-child th { border-bottom: 0; }
th.l, td.l { text-align: left; }
.name { display: block; max-width: 9.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.missing, .unit { color: var(--text-3); font-weight: 400; }
.sub { display: block; white-space: nowrap; font-size: 11px; line-height: 1.25; color: var(--text-2); font-weight: 400; }
thead .short { display: none; }
td.c-size, td.c-pnl, td.c-lev { white-space: normal; }
.name.word { max-width: 6em; }
.c-lev .name { margin-left: auto; }
.hero .value.up { color: var(--up); }
.hero .value.down { color: var(--down); }
/* entry → mark → liquidation of the inspected row, on one price scale: a ring where the
   position was opened, a dot where the market is, a bar where it would be liquidated */
.scale { flex: 0 0 100%; }
.track { position: relative; display: block; max-width: 420px; height: 16px; margin: 4px 6px 2px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; border-radius: 1px; background: var(--border); }
.track i { position: absolute; }
.track .seg { top: 6px; height: 4px; border-radius: 2px; background: var(--text-3); }
.track .seg.up { background: var(--up); }
.track .seg.down { background: var(--down); }
.track .liq, .key .liq { width: 3px; height: 14px; border-radius: 1px; background: var(--down); }
.track .liq { top: 1px; margin-left: -1.5px; box-shadow: 0 0 0 2px var(--bg); }
.track .entry, .key .entry { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--text); background: var(--bg); }
.track .mark, .key .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.track .entry, .track .mark { top: 3px; margin-left: -5px; box-shadow: 0 0 0 2px var(--bg); }
.key { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.key i { display: inline-block; flex: none; }
/* narrower hosts shed whole columns — the table never overflows; whatever a hidden column
   held is in the readout of the row */
@media (max-width: 719px) {
    .name { max-width: 8.5em; }
    th, td, thead th { padding-left: 5px; padding-right: 5px; }
}
@media (max-width: 639px) {
    .c-entry { display: none; }
}
@media (max-width: 559px) {
    .c-lev { display: none; }
}
@media (max-width: 479px) {
    .c-mark { display: none; }
    .name { max-width: 7em; }
}
@media (max-width: 439px) {
    .name { max-width: 5.5em; }
}
@media (max-width: 379px) {
    body { font-size: 12px; }
    .c-liq { display: none; }
    th, td, thead th { padding-left: 4px; padding-right: 4px; }
}
</style>
</head>
<body>
<div class="head">
    <div>
        <div class="title"><h1 id="heading">Positions</h1><span class="venue" id="venue"></span><span class="account" id="accountwrap" hidden><span class="name" id="account"></span><span class="env" id="env" hidden></span></span></div>
        <div class="hero" id="hero" hidden><span class="value" id="figure">–</span><span class="context" id="context"></span></div>
        <div class="asof" id="asof"></div>
    </div>
    <div class="controls">
        <button type="button" id="refresh" title="Fetch the latest positions" hidden>Refresh</button>
    </div>
</div>
<div class="board" id="board"></div>
<div class="readout" id="readout" aria-live="off" hidden></div>
<div class="note" id="note" hidden></div>
<div class="status" id="status" role="status">Waiting for data…</div>
<script>
/* @include bridge.js */
</script>
<script>
(function () {
    'use strict';
    // ---- shared by the account views (balance, orders, positions): kept identical in each ----
    var app = window.ccxtApp;
    var ENVIRONMENTS = {
        live: [ 'LIVE', 'Live account: real funds' ],
        sandbox: [ 'TESTNET', 'Testnet account: practice funds, nothing here is real' ],
        demo: [ 'DEMO', 'Demo trading account: simulated funds' ]
    };
    var data = null;
    var rows = [];
    var args = null;
    var sort = { key: null, direction: 1 };
    var active = -1;
    var activeKey = null;
    var busy = false;
    var parts = null;
    var readoutHeight = 0;
    var nodes = {};
    [ 'heading', 'venue', 'accountwrap', 'account', 'env', 'hero', 'figure', 'context', 'asof', 'refresh', 'board', 'readout', 'note', 'status' ].forEach (function (id) {
        nodes[id] = document.getElementById (id);
    });

    function setStatus (text, isError) {
        nodes.status.textContent = text || '';
        nodes.status.className = 'status' + (isError ? ' error' : '');
    }

    // every field of the payload is optional and none of it is trusted to have its type
    function text (value) {
        if (app.isNumber (value)) {
            return String (value);
        }
        return (typeof value === 'string' && value) ? value : undefined;
    }

    function number (value) {
        // "+ 0" turns a negative zero into zero: it would print as "-0"
        return app.isNumber (value) ? value + 0 : undefined;
    }

    // outside the range a Date can hold, bridge.dateTime would throw
    function time (value) {
        return (app.isNumber (value) && Math.abs (value) <= 8.64e15) ? value : undefined;
    }

    function plural (count, word) {
        return count + ' ' + word + ((count === 1) ? '' : 's');
    }

    function localized (value, options) {
        var tag = app.context ().locale;
        try {
            return value.toLocaleString ((typeof tag === 'string' && tag) ? tag : undefined, options);
        } catch (error) {
            return value.toLocaleString (undefined, options);
        }
    }

    // bridge.compact, bridge.price and bridge.percent stop at "T": beyond it, and below what
    // fits a table cell, a number is written with its exponent instead of a row of zeros
    function exponent (value) {
        return value.toExponential (2).replace (/-/g, '−').replace ('e+', 'e');
    }

    function extreme (value) {
        var size = Math.abs (value);
        return size >= 1e15 || (size > 0 && size < 1e-8);
    }

    function compact (value) {
        return (app.isNumber (value) && extreme (value)) ? exponent (value) : app.compact (value);
    }

    function price (value) {
        return (app.isNumber (value) && extreme (value)) ? exponent (value) : app.price (value);
    }

    function percent (value) {
        if (app.isNumber (value) && Math.abs (value) >= 1e15) {
            return ((value > 0) ? '+' : '−') + exponent (Math.abs (value)) + '%';
        }
        // a loss too small to print is not "−0.00%"
        return app.percent ((app.isNumber (value) && Math.abs (value) < 0.005) ? 0 : value);
    }

    // An amount of an asset or of contracts: the digits the venue reported, up to ~9
    // significant ones (bridge.price pads to two decimals, which reads as money).
    function quantity (value) {
        if (!app.isNumber (value)) {
            return '–';
        }
        var size = Math.abs (value);
        if (size === 0) {
            return '0';
        }
        if (size >= 1e9 || extreme (value)) {
            return compact (value);
        }
        if (size < 1) {
            return localized (value, { maximumSignificantDigits: 6 });
        }
        return localized (value, { maximumFractionDigits: Math.max (0, 8 - Math.floor (Math.log (size) / Math.LN10 + 1e-9)) });
    }

    // a value in the quote or settle currency
    function money (value) {
        if (!app.isNumber (value)) {
            return '–';
        }
        var size = Math.abs (value);
        if (size >= 1e9) {
            return compact (value);
        }
        if (size >= 1 || size === 0) {
            return localized (value, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return price (value);
    }

    function setEnvironment (node, value) {
        var known = (typeof value === 'string' && Object.prototype.hasOwnProperty.call (ENVIRONMENTS, value)) ? ENVIRONMENTS[value] : null;
        node.hidden = !known;
        node.className = 'env' + ((value === 'live') ? ' live' : '');
        node.textContent = known ? known[0] : '';
        node.title = known ? known[1] : '';
    }

    function labelled (parent, label, value) {
        var item = app.element ('span', '', label + ' ');
        item.appendChild (app.element ('b', '', value));
        parent.appendChild (item);
        return item;
    }

    function setActive (index) {
        active = index;
        activeKey = rows[index] ? rows[index].key : null;
        if (!parts) {
            return;
        }
        Array.prototype.forEach.call (parts.body.rows, function (line) {
            line.classList.toggle ('active', Number (line.getAttribute ('data-index')) === index);
        });
        nodes.readout.textContent = '';
        if (index >= 0 && rows[index]) {
            view.readout (nodes.readout, rows[index]);
        } else {
            nodes.readout.appendChild (app.element ('span', '', view.hint));
        }
        // The readout wraps, and how many lines it takes depends on the row. It only ever
        // grows (until the data or the width changes): a view that shrank again when the
        // pointer left would move the page under that pointer.
        if (nodes.readout.offsetHeight > readoutHeight) {
            readoutHeight = nodes.readout.offsetHeight;
            nodes.readout.style.minHeight = readoutHeight + 'px';
        }
    }

    function releaseReadout () {
        readoutHeight = 0;
        nodes.readout.style.minHeight = '';
    }

    function compare (a, b) {
        var left = a[sort.key];
        var right = b[sort.key];
        // a row without the value goes last whichever way the column is sorted
        if (left === undefined || right === undefined) {
            return (left === right) ? (a.index - b.index) : ((left === undefined) ? 1 : -1);
        }
        var order = (typeof left === 'string') ? left.localeCompare (right) : (left - right);
        return (order * sort.direction) || (a.index - b.index);
    }

    function fillBody () {
        var body = parts.body;
        var ordered = rows.slice ();
        if (sort.key) {
            ordered.sort (compare);
        }
        body.textContent = '';
        ordered.forEach (function (row, position) {
            var line = document.createElement ('tr');
            line.setAttribute ('data-index', row.index);
            line.setAttribute ('data-key', row.key);
            line.tabIndex = (position === 0) ? 0 : -1;
            view.columns.forEach (function (column) {
                var cell = app.element (column.header ? 'th' : 'td', ((column.className || '') + ((column.text || column.left) ? ' l' : '')).trim ());
                if (column.header) {
                    cell.scope = 'row';
                }
                column.fill (cell, row);
                line.appendChild (cell);
            });
            body.appendChild (line);
        });
        parts.heads.forEach (function (entry) {
            var state = (sort.key === entry.column.key) ? ((sort.direction > 0) ? 'ascending' : 'descending') : 'none';
            entry.cell.setAttribute ('aria-sort', state);
            entry.glyph.textContent = (state === 'ascending') ? '↑' : ((state === 'descending') ? '↓' : '');
        });
        setActive (-1);
    }

    function sortBy (column) {
        var natural = column.text ? 1 : -1;
        if (sort.key !== column.key) {
            sort = { key: column.key, direction: natural };
        } else if (sort.direction === natural) {
            sort = { key: column.key, direction: -natural };
        } else {
            // third press: back to the order the server sent
            sort = { key: null, direction: 1 };
        }
        fillBody ();
    }

    function moveFocus (event) {
        var line = event.target;
        var all = parts.body.rows;
        var current = Array.prototype.indexOf.call (all, line);
        var next = { ArrowDown: current + 1, ArrowUp: current - 1, Home: 0, End: all.length - 1 }[event.key];
        if (current < 0 || next === undefined) {
            return;
        }
        event.preventDefault ();
        next = Math.max (0, Math.min (all.length - 1, next));
        line.tabIndex = -1;
        all[next].tabIndex = 0;
        all[next].focus ();
    }

    function renderTable () {
        var table = document.createElement ('table');
        var caption = app.element ('caption', '', view.caption () + ' Column headers sort the table; arrow keys move between rows.');
        caption.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;';
        table.appendChild (caption);
        var thead = document.createElement ('thead');
        var headRow = document.createElement ('tr');
        var heads = view.columns.map (function (column) {
            var cell = app.element ('th', ((column.className || '') + ((column.text || column.left) ? ' l' : '')).trim ());
            cell.scope = 'col';
            var button = document.createElement ('button');
            button.type = 'button';
            button.title = column.hint;
            var glyph = app.element ('span', 'dir');
            glyph.setAttribute ('aria-hidden', 'true');
            var label = app.element ('span', '');
            // "In orders" when there is room, "Used" when there is not
            label.appendChild (app.element ('span', column.short ? 'long' : '', column.label));
            if (column.short) {
                label.appendChild (app.element ('span', 'short', column.short));
            }
            var unit = column.unit ? column.unit () : '';
            if (unit) {
                label.appendChild (document.createTextNode (' '));
                label.appendChild (app.element ('span', 'unit', unit));
            }
            // the arrow sits on the side the column is aligned away from, so labels stay put
            button.appendChild ((column.text || column.left) ? label : glyph);
            button.appendChild ((column.text || column.left) ? glyph : label);
            button.addEventListener ('click', function () { sortBy (column); });
            cell.appendChild (button);
            headRow.appendChild (cell);
            return { column: column, cell: cell, glyph: glyph };
        });
        thead.appendChild (headRow);
        table.appendChild (thead);
        var body = document.createElement ('tbody');
        var rowOf = function (event) {
            var line = (event.target && event.target.closest) ? event.target.closest ('tr') : null;
            return line ? Number (line.getAttribute ('data-index')) : -1;
        };
        body.addEventListener ('pointerover', function (event) { setActive (rowOf (event)); });
        body.addEventListener ('pointerdown', function (event) { setActive (rowOf (event)); });
        body.addEventListener ('pointerleave', function () { setActive (rowOf ({ target: document.activeElement })); });
        body.addEventListener ('focusin', function (event) { setActive (rowOf (event)); });
        body.addEventListener ('focusout', function () { setActive (-1); });
        body.addEventListener ('keydown', moveFocus);
        table.appendChild (body);
        parts = { body: body, heads: heads };
        nodes.board.className = 'board scroll';
        nodes.board.appendChild (table);
        fillBody ();
    }

    // Rebuilding the board replaces the focused row or sort button. Remember where the user
    // was (by row key: the rows themselves may be newer ones) so a refresh or a host context
    // update does not throw a keyboard user back to the top of the document.
    function place () {
        var focus = document.activeElement;
        var line = (parts && focus && focus.closest && parts.body.contains (focus)) ? focus.closest ('tr') : null;
        var column = -1;
        (parts ? parts.heads : []).forEach (function (entry, position) {
            if (focus && entry.cell.contains (focus)) {
                column = position;
            }
        });
        return { focused: line ? line.getAttribute ('data-key') : null, column: column, active: activeKey, scroll: nodes.board.scrollTop };
    }

    function restore (kept) {
        if (!parts) {
            return;
        }
        var lineOf = function (key) {
            var found = null;
            Array.prototype.forEach.call (parts.body.rows, function (line) {
                if (key !== null && !found && line.getAttribute ('data-key') === key) {
                    found = line;
                }
            });
            return found;
        };
        nodes.board.scrollTop = kept.scroll;
        var focused = lineOf (kept.focused);
        var hovered = lineOf (kept.active);
        if (focused) {
            Array.prototype.forEach.call (parts.body.rows, function (line) { line.tabIndex = (line === focused) ? 0 : -1; });
            // focusin makes it the inspected row again
            focused.focus ({ preventScroll: true });
        } else if (kept.column >= 0 && parts.heads[kept.column]) {
            parts.heads[kept.column].cell.querySelector ('button').focus ({ preventScroll: true });
        }
        if (hovered && !focused) {
            setActive (Number (hovered.getAttribute ('data-index')));
        }
    }

    function setNote (lines) {
        nodes.note.textContent = lines.join (' · ');
        nodes.note.hidden = !lines.length;
    }

    function render () {
        if (!data) {
            return;
        }
        var kept = place ();
        var account = text (data.account);
        nodes.venue.textContent = text (data.exchangeName) || text (data.exchange) || '';
        nodes.account.textContent = account || '';
        nodes.account.title = account ? 'Account ' + account : '';
        setEnvironment (nodes.env, data.environment);
        nodes.accountwrap.hidden = !account && nodes.env.hidden;
        view.header ();
        nodes.refresh.hidden = !app.canCallTools ();
        nodes.refresh.disabled = busy;
        nodes.readout.hidden = !rows.length;
        releaseReadout ();
        nodes.board.textContent = '';
        parts = null;
        if (!rows.length) {
            nodes.board.className = 'board';
            nodes.board.appendChild (app.element ('div', 'empty', view.empty ()));
        } else {
            renderTable ();
            restore (kept);
        }
    }

    function usable (payload) {
        return !!payload && payload.view === view.name && Array.isArray (payload[view.list]);
    }

    function accept (payload) {
        if (!usable (payload)) {
            if (!data) {
                // nothing on screen yet: say so instead of waiting forever
                setStatus ('Could not load: the host sent data this view cannot display.', true);
            }
            return;
        }
        data = payload;
        rows = payload[view.list].filter (function (entry) { return entry && typeof entry === 'object'; }).map (view.normalize);
        setStatus ('');
        render ();
    }

    function reload () {
        if (busy || !data) {
            return;
        }
        var request = {};
        var base = args || view.fallbackArgs ();
        Object.keys (base).forEach (function (key) {
            if (base[key] !== undefined) {
                request[key] = base[key];
            }
        });
        var finish = function () {
            busy = false;
            nodes.board.classList.remove ('busy');
            nodes.refresh.disabled = false;
        };
        busy = true;
        nodes.board.classList.add ('busy');
        nodes.refresh.disabled = true;
        setStatus ('Loading…');
        app.callTool (view.tool, request).then (function (payload) {
            finish ();
            if (!usable (payload)) {
                setStatus ('Could not load: the host returned no ' + view.noun + '.', true);
                return;
            }
            accept (payload);
        }, function (error) {
            finish ();
            setStatus ('Could not load: ' + ((error && error.message) || 'unknown error'), true);
        });
    }

    function start () {
        nodes.refresh.addEventListener ('click', reload);
        var lastWidth = document.documentElement.clientWidth;
        window.addEventListener ('resize', function () {
            // the height grows with the content: only a new width changes how the readout wraps
            var width = document.documentElement.clientWidth;
            if (width !== lastWidth) {
                lastWidth = width;
                releaseReadout ();
                if (parts) {
                    setActive (active);
                }
            }
        });
        app.connect ({
            name: 'ccxt-' + view.name,
            onInput: function (input) { args = input; },
            onResult: accept,
            onError: function (message) { setStatus ('Could not load: ' + message, true); },
            onContext: function () { render (); }
        }).then (function () {
            nodes.refresh.hidden = !data || !app.canCallTools ();
        }, function () {
            setStatus ('Could not connect to the host.', true);
        });
        // development hook: open the file directly and call window.ccxtView.accept (payload)
        window.ccxtView = { accept: accept };
    }
    // ---- end of the shared part ----

    function capital (value) {
        return value ? value.charAt (0).toUpperCase () + value.slice (1) : value;
    }

    // a signed amount of money: the sign is typographic, like bridge.percent
    function signed (value) {
        if (!app.isNumber (value)) {
            return '–';
        }
        return ((value > 0) ? '+' : ((value < 0) ? '−' : '')) + money (Math.abs (value));
    }

    // direction is never colour alone: an arrow glyph and a signed number carry it
    function setDelta (node, value, label, base) {
        var direction = app.isNumber (value) ? ((value > 0) ? 'up' : ((value < 0) ? 'down' : '')) : '';
        var arrow = (direction === 'up') ? '▲ ' : ((direction === 'down') ? '▼ ' : '');
        node.textContent = arrow + label;
        node.className = base + (direction ? ' ' + direction : '') + (app.isNumber (value) ? '' : ' missing');
    }

    function sideNode (row) {
        var long = row.side === 'long';
        var short = row.side === 'short';
        var label = long ? '▲ Long' : (short ? '▼ Short' : (capital (row.side) || '–'));
        // an unknown side is the venue's own word: shown, but not given a column's width
        return app.element ('span', long ? 'delta up' : (short ? 'delta down' : 'name word missing'), label);
    }

    function priceCell (key) {
        return function (cell, row) {
            cell.textContent = price (row[key]);
            if (row[key] === undefined) {
                cell.classList.add ('missing');
            }
        };
    }

    // what the contracts amount to: base currency on a linear market, quote on an inverse one
    function equivalent (row, brief) {
        if (row.contracts === undefined || row.contractSize === undefined || row.contractSize === 1 || !(row.contractSize > 0)) {
            return '';
        }
        var unit = row.inverse ? row.quote : row.base;
        var amount = number (row.contracts * row.contractSize);
        if (amount === undefined) {
            return '';
        }
        // the table cell has no room for seven digits: the readout prints them all
        return ((brief && Math.abs (amount) >= 1e6) ? compact (amount) : quantity (amount)) + (unit ? ' ' + unit : '');
    }

    // how far the mark price is from liquidation, as a share of the mark price
    function distance (row) {
        if (row.liquidationPrice === undefined || !(row.markPrice > 0)) {
            return undefined;
        }
        return number ((Math.abs (row.markPrice - row.liquidationPrice) / row.markPrice) * 100);
    }

    function track (row) {
        var points = [ [ 'liq', row.liquidationPrice, 'liquidation' ], [ 'entry', row.entryPrice, 'entry' ], [ 'mark', row.markPrice, 'mark' ] ].filter (function (point) { return point[1] !== undefined; });
        var low = Infinity;
        var high = -Infinity;
        points.forEach (function (point) {
            low = Math.min (low, point[1]);
            high = Math.max (high, point[1]);
        });
        if (points.length < 2 || !(high > low) || !app.isNumber (high - low)) {
            return null;
        }
        var at = function (value) { return 2 + ((value - low) / (high - low)) * 96; };
        var node = app.element ('span', 'track');
        node.setAttribute ('role', 'img');
        node.setAttribute ('aria-label', 'Price scale from ' + price (low) + ' to ' + price (high) + ': ' + points.map (function (point) { return point[2] + ' ' + price (point[1]); }).join (', '));
        if (row.entryPrice !== undefined && row.markPrice !== undefined && row.entryPrice !== row.markPrice) {
            var gain = (row.markPrice - row.entryPrice) * ((row.side === 'short') ? -1 : 1);
            var known = row.side === 'long' || row.side === 'short';
            var segment = app.element ('i', 'seg' + (known ? ((gain > 0) ? ' up' : ' down') : ''));
            segment.style.left = at (Math.min (row.entryPrice, row.markPrice)).toFixed (2) + '%';
            segment.style.width = (Math.abs (at (row.markPrice) - at (row.entryPrice))).toFixed (2) + '%';
            node.appendChild (segment);
        }
        points.forEach (function (point) {
            var marker = app.element ('i', point[0]);
            marker.style.left = at (point[1]).toFixed (2) + '%';
            node.appendChild (marker);
        });
        return { node: node, kinds: points.map (function (point) { return point[0]; }) };
    }

    // the unrealized PnL of every row adds up only when all of them are in one currency
    function totalPnl () {
        var unit;
        var sum = 0;
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (row.unrealizedPnl === undefined || !row.unit || (unit !== undefined && unit !== row.unit)) {
                return null;
            }
            unit = row.unit;
            sum += row.unrealizedPnl;
        }
        return (rows.length && app.isNumber (sum)) ? { value: sum, unit: unit } : null;
    }

    var view = {
        name: 'positions',
        list: 'positions',
        tool: 'show_positions',
        noun: 'positions',
        hint: 'Point at, tap or focus a row for its margin, notional and distance to liquidation.',
        columns: [
            { key: 'symbol', label: 'Symbol', hint: 'Sort by symbol', text: true, header: true, fill: function (cell, row) {
                var name = app.element ('span', 'name', row.symbol);
                name.title = row.symbol;
                cell.appendChild (name);
            } },
            { key: 'side', label: 'Side', hint: 'Sort by side', text: true, fill: function (cell, row) {
                cell.appendChild (sideNode (row));
            } },
            { key: 'contracts', label: 'Size', hint: 'Sort by size in contracts', className: 'c-size', fill: function (cell, row) {
                cell.appendChild (app.element ('span', (row.contracts === undefined) ? 'missing' : '', quantity (row.contracts)));
                var worth = equivalent (row);
                if (worth) {
                    cell.appendChild (app.element ('span', 'sub', '= ' + equivalent (row, true)));
                }
            } },
            { key: 'entryPrice', label: 'Entry', hint: 'Sort by entry price', className: 'c-entry', fill: priceCell ('entryPrice') },
            { key: 'markPrice', label: 'Mark', hint: 'Sort by mark price', className: 'c-mark', fill: priceCell ('markPrice') },
            { key: 'liquidationPrice', label: 'Liq. price', short: 'Liq.', hint: 'Sort by liquidation price', className: 'c-liq', fill: priceCell ('liquidationPrice') },
            { key: 'unrealizedPnl', label: 'PnL', hint: 'Sort by unrealized profit and loss', className: 'c-pnl', fill: function (cell, row) {
                var value = app.element ('span', '');
                setDelta (value, row.unrealizedPnl, signed (row.unrealizedPnl), 'delta');
                cell.appendChild (value);
                if (row.percentage !== undefined) {
                    cell.appendChild (app.element ('span', 'sub', percent (row.percentage)));
                }
            } },
            { key: 'leverage', label: 'Leverage', short: 'Lev.', hint: 'Sort by leverage', className: 'c-lev', fill: function (cell, row) {
                cell.appendChild (app.element ('span', (row.leverage === undefined) ? 'missing' : '', (row.leverage === undefined) ? '–' : quantity (row.leverage) + '×'));
                if (row.marginMode) {
                    cell.appendChild (app.element ('span', 'sub name word', row.marginMode));
                }
            } }
        ],
        normalize: function (entry, index) {
            var side = text (entry.side);
            var mode = text (entry.marginMode);
            var row = { index: index, symbol: text (entry.symbol) || '–', side: side ? side.toLowerCase () : undefined, marginMode: mode ? mode.toLowerCase () : undefined };
            [ 'contracts', 'contractSize', 'notional', 'entryPrice', 'markPrice', 'liquidationPrice', 'unrealizedPnl', 'realizedPnl', 'percentage', 'leverage', 'collateral', 'initialMargin' ].forEach (function (key) {
                row[key] = number (entry[key]);
            });
            // venues report "no liquidation price" as 0
            if (row.liquidationPrice === 0) {
                row.liquidationPrice = undefined;
            }
            row.timestamp = time (entry.timestamp);
            // BASE/QUOTE:SETTLE[-EXPIRY]: PnL and margin are in the settle currency, and a
            // market settled in its base currency is an inverse one
            var codes = /^([^\/:\s]{1,16})\/([^\/:\s]{1,16})(?::([^\-:\s]{1,16}))?/.exec (row.symbol) || [];
            row.base = codes[1];
            row.quote = codes[2];
            row.unit = codes[3] || codes[2];
            row.inverse = !!codes[3] && codes[3] === codes[1];
            row.key = row.symbol + '|' + (row.side || '');
            return row;
        },
        caption: function () {
            return 'Open positions of account ' + (text (data.account) || '') + ' on ' + (text (data.exchangeName) || text (data.exchange) || 'the exchange') + '.';
        },
        header: function () {
            var total = totalPnl ();
            var newest;
            rows.forEach (function (row) {
                if (row.timestamp !== undefined && (newest === undefined || row.timestamp > newest)) {
                    newest = row.timestamp;
                }
            });
            nodes.hero.hidden = !rows.length;
            if (total) {
                setDelta (nodes.figure, total.value, signed (total.value) + ' ' + total.unit, 'value');
                nodes.context.textContent = 'unrealized PnL · ' + plural (rows.length, 'position');
            } else {
                nodes.figure.className = 'value';
                nodes.figure.textContent = plural (rows.length, 'position');
                nodes.context.textContent = '';
            }
            nodes.asof.textContent = (newest === undefined) ? '' : 'as of ' + app.dateTime (newest);
            setNote ([]);
        },
        empty: function () {
            return 'No open positions.';
        },
        readout: function (node, row) {
            node.appendChild (app.element ('b', 'sym', row.symbol));
            var unit = row.unit ? ' ' + row.unit : '';
            var withUnit = function (value) { return (value === undefined) ? '–' : money (value) + unit; };
            var gap = distance (row);
            var worth = equivalent (row);
            var pairs = [
                [ 'Size', quantity (row.contracts) + (worth ? ' (' + worth + ')' : '') ],
                [ 'Entry', price (row.entryPrice) ], [ 'Mark', price (row.markPrice) ], [ 'Liq. price', price (row.liquidationPrice) ],
                [ 'To liquidation', (gap === undefined) ? '–' : percent (gap).replace (/^\+/, '') ],
                [ 'Notional', (row.notional === undefined) ? '–' : money (Math.abs (row.notional)) ],
                [ 'Margin', withUnit ((row.collateral !== undefined) ? row.collateral : row.initialMargin) ],
                [ 'Unrealized PnL', (row.unrealizedPnl === undefined) ? '–' : signed (row.unrealizedPnl) + unit + ((row.percentage !== undefined) ? ' (' + percent (row.percentage) + ')' : '') ],
                [ 'Realized PnL', (row.realizedPnl === undefined) ? '–' : signed (row.realizedPnl) + unit ],
                [ 'Leverage', (row.leverage === undefined) ? '–' : quantity (row.leverage) + '×' + (row.marginMode ? ' ' + row.marginMode : '') ]
            ];
            pairs.forEach (function (pair) { labelled (node, pair[0], pair[1]); });
            var scale = track (row);
            if (scale) {
                var wrap = app.element ('span', 'scale');
                wrap.appendChild (scale.node);
                var key = app.element ('span', 'key');
                key.setAttribute ('aria-hidden', 'true');
                [ [ 'liq', 'Liquidation' ], [ 'entry', 'Entry' ], [ 'mark', 'Mark' ] ].forEach (function (entry) {
                    if (scale.kinds.indexOf (entry[0]) !== -1) {
                        var item = document.createElement ('span');
                        item.appendChild (app.element ('i', entry[0]));
                        item.appendChild (document.createTextNode (entry[1]));
                        key.appendChild (item);
                    }
                });
                wrap.appendChild (key);
                node.appendChild (wrap);
            }
        },
        fallbackArgs: function () {
            return { account: data.account };
        }
    };

    start ();
}) ();
</script>
</body>
</html>
