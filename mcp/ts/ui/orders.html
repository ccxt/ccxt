<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCXT orders</title>
<style>
/* @include shared.css */
/* @include account.css */
td.c-price, td.c-status { white-space: normal; }
.name.word { max-width: 6em; }
/* filled: the percentage, and a thin neutral meter of filled against the order amount */
.fill { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }
.prog { position: relative; flex: none; width: 28px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.flag { color: var(--text); font-weight: 600; }
/* narrower hosts shed decoration first, then whole columns — the table never overflows;
   whatever a hidden column held is in the readout of the row */
@media (max-width: 699px) {
    .c-type { display: none; }
    .name { max-width: 8.5em; }
    th, td, thead th { padding-left: 5px; padding-right: 5px; }
}
@media (max-width: 539px) {
    .c-time { display: none; }
    .prog { display: none; }
}
@media (max-width: 439px) {
    .c-status { display: none; }
    .name { max-width: 7em; }
}
@media (max-width: 379px) {
    body { font-size: 12px; }
    .c-amount { display: none; }
    th, td, thead th { padding-left: 4px; padding-right: 4px; }
}
</style>
</head>
<body>
<div class="head">
    <div>
        <div class="title"><h1 id="heading">Orders</h1><span class="venue" id="venue"></span><span class="account" id="accountwrap" hidden><span class="name" id="account"></span><span class="env" id="env" hidden></span></span></div>
        <div class="hero" id="hero" hidden><span class="value" id="figure">–</span><span class="context" id="context"></span></div>
        <div class="asof" id="asof"></div>
    </div>
    <div class="controls">
        <button type="button" id="refresh" title="Fetch the latest orders" hidden>Refresh</button>
    </div>
</div>
<div class="board" id="board"></div>
<div class="readout" id="readout" aria-live="off" hidden></div>
<div class="note" id="note" hidden></div>
<div class="status" id="status" role="status">Waiting for data…</div>
<script>
/* @include bridge.js */
/* @include table.js */
</script>
<script>
(function () {
    'use strict';
    var app = window.ccxtApp;
    var table = window.ccxtTable;
    var text = table.format.text;
    var number = table.format.number;
    var time = table.format.time;
    var plural = table.format.plural;
    var capital = table.format.capital;
    var price = table.format.price;
    var quantity = table.format.quantity;
    var money = table.format.money;
    var labelled = table.labelled;
    // the account view built from `view` at the end: board.data is the payload, board.rows
    // its normalized rows, board.nodes the elements of the page
    var board;

    var STATUS = { open: 'Open', closed: 'Closed', canceled: 'Canceled', cancelled: 'Canceled', expired: 'Expired', rejected: 'Rejected' };
    var HEADINGS = { open: 'Open orders', closed: 'Closed orders', canceled: 'Canceled orders', all: 'Orders' };
    var SHORT_TIME = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };

    function filter () {
        var status = text (board.data.status);
        return (status && Object.prototype.hasOwnProperty.call (HEADINGS, status)) ? status : 'all';
    }

    // direction is never colour alone: an arrow and the word carry it
    function sideNode (row) {
        var buy = row.side === 'buy';
        var sell = row.side === 'sell';
        var label = buy ? '▲ Buy' : (sell ? '▼ Sell' : (capital (row.side) || '–'));
        // an unknown side is the venue's own word: shown, but not given a column's width
        return app.element ('span', buy ? 'delta up' : (sell ? 'delta down' : 'name word missing'), label);
    }

    function priceText (row) {
        if (row.price !== undefined) {
            return price (row.price);
        }
        return (row.type && row.type.indexOf ('market') !== -1) ? 'market' : '–';
    }

    function filledText (row) {
        return (row.ratio !== undefined) ? Math.floor (row.ratio * 100 + 1e-9) + '%' : quantity (row.filled);
    }

    // a repeated row key gets its ordinal: focus and the readout follow the key across a rebuild
    var uniqueKey = table.uniqueKeys ();

    // own keys only: a status of "constructor" is the venue's word, not Object.prototype's
    function statusLabel (row) {
        if (!row.status) {
            return '–';
        }
        return Object.prototype.hasOwnProperty.call (STATUS, row.status) ? STATUS[row.status] : capital (row.status);
    }

    function feeText (fee) {
        return quantity (fee.cost) + (fee.currency ? ' ' + fee.currency : '');
    }

    var view = {
        name: 'orders',
        list: 'orders',
        tool: 'show_orders',
        noun: 'orders',
        hint: 'Point at, tap or focus a row for its id, average price, cost and fee.',
        columns: [
            { key: 'timestamp', label: 'Time', hint: 'Sort by time', className: 'c-time', left: true, fill: function (cell, row) {
                cell.textContent = (row.timestamp === undefined) ? '–' : app.dateTime (row.timestamp, SHORT_TIME);
                if (row.timestamp === undefined) {
                    cell.classList.add ('missing');
                } else {
                    cell.title = app.dateTime (row.timestamp);
                }
            } },
            { key: 'symbol', label: 'Symbol', hint: 'Sort by symbol', text: true, header: true, fill: function (cell, row) {
                var name = app.element ('span', 'name', row.symbol);
                name.title = row.symbol;
                cell.appendChild (name);
            } },
            { key: 'side', label: 'Side', hint: 'Sort by side', text: true, fill: function (cell, row) {
                cell.appendChild (sideNode (row));
            } },
            { key: 'type', label: 'Type', hint: 'Sort by order type', className: 'c-type', text: true, fill: function (cell, row) {
                var name = app.element ('span', 'name word', capital (row.type) || '–');
                name.title = row.type || '';
                cell.appendChild (name);
                if (!row.type) {
                    cell.classList.add ('missing');
                }
            } },
            { key: 'price', label: 'Price', hint: 'Sort by limit price (market orders last)', className: 'c-price', fill: function (cell, row) {
                var label = priceText (row);
                cell.appendChild (app.element ('span', (row.price === undefined) ? 'missing' : '', label));
                if (row.triggerPrice !== undefined) {
                    cell.appendChild (app.element ('span', 'sub', 'trigger ' + price (row.triggerPrice)));
                }
            } },
            { key: 'amount', label: 'Amount', hint: 'Sort by amount', className: 'c-amount', fill: function (cell, row) {
                cell.textContent = quantity (row.amount);
                if (row.amount === undefined) {
                    cell.classList.add ('missing');
                }
            } },
            { key: 'ratio', label: 'Filled', hint: 'Sort by the filled share of the order amount', className: 'c-filled', fill: function (cell, row) {
                if (row.ratio === undefined) {
                    cell.textContent = quantity (row.filled);
                    if (row.filled === undefined) {
                        cell.classList.add ('missing');
                    }
                    return;
                }
                var wrap = app.element ('span', 'fill');
                wrap.title = quantity (row.filled) + ' of ' + quantity (row.amount) + ' filled';
                wrap.appendChild (app.element ('span', '', filledText (row)));
                var bar = app.element ('span', 'prog');
                bar.setAttribute ('aria-hidden', 'true');
                if (row.ratio > 0) {
                    var fill = document.createElement ('i');
                    fill.style.width = 'max(1px, ' + (row.ratio * 100).toFixed (2) + '%)';
                    bar.appendChild (fill);
                }
                wrap.appendChild (bar);
                cell.appendChild (wrap);
            } },
            { key: 'status', label: 'Status', hint: 'Sort by status', className: 'c-status', text: true, fill: function (cell, row) {
                var label = statusLabel (row);
                var name = app.element ('span', 'name word', label);
                name.title = label;
                cell.appendChild (name);
                if (!row.status) {
                    cell.classList.add ('missing');
                }
            } }
        ],
        normalize: function (entry, index) {
            var lower = function (value) {
                var string = text (value);
                return string ? string.toLowerCase () : undefined;
            };
            var row = {
                index: index,
                id: text (entry.id),
                clientOrderId: text (entry.clientOrderId),
                symbol: text (entry.symbol) || '–',
                type: lower (entry.type),
                side: lower (entry.side),
                status: lower (entry.status),
                timeInForce: text (entry.timeInForce),
                postOnly: entry.postOnly === true,
                reduceOnly: entry.reduceOnly === true
            };
            [ 'price', 'triggerPrice', 'amount', 'filled', 'remaining', 'average', 'cost' ].forEach (function (key) {
                row[key] = number (entry[key]);
            });
            // a market order is reported with price 0 by some venues: that is not a price
            if (row.price === 0) {
                row.price = undefined;
            }
            row.timestamp = time (entry.timestamp);
            if (row.timestamp === undefined && typeof entry.datetime === 'string') {
                row.timestamp = time (Date.parse (entry.datetime));
            }
            [ 'amount', 'filled', 'remaining' ].forEach (function (key) {
                if (row[key] < 0) {
                    row[key] = undefined;
                }
            });
            if (row.filled === undefined && row.amount !== undefined && row.remaining !== undefined) {
                row.filled = Math.max (0, row.amount - row.remaining);
            }
            if (row.amount > 0 && row.filled !== undefined) {
                row.ratio = Math.max (0, Math.min (1, row.filled / row.amount));
            }
            var fee = entry.fee;
            if (fee && typeof fee === 'object' && app.isNumber (fee.cost)) {
                row.fee = { cost: fee.cost, currency: text (fee.currency) };
            }
            // an order id is only unique per symbol on some venues, and a list can span symbols
            row.key = uniqueKey ((row.id || '') + '|' + row.symbol, index);
            return row;
        },
        caption: function () {
            return HEADINGS[filter ()] + ' of account ' + (text (board.data.account) || '') + ' on ' + (text (board.data.exchangeName) || text (board.data.exchange) || 'the exchange') + '.';
        },
        header: function () {
            var symbol = text (board.data.symbol);
            board.nodes.heading.textContent = HEADINGS[filter ()] + (symbol ? ' · ' + symbol : '');
            board.nodes.hero.hidden = true;
            board.nodes.asof.textContent = board.rows.length ? plural (board.rows.length, 'order') : '';
            board.setNote ((board.data.hasMore === true) ? [ 'More orders exist than are shown here. Ask the assistant for a single symbol or a later start time to see the rest.' ] : []);
        },
        empty: function () {
            var symbol = text (board.data.symbol);
            var status = filter ();
            return 'No ' + ((status === 'all') ? '' : status + ' ') + 'orders' + (symbol ? ' for ' + symbol : '') + '.';
        },
        readout: function (node, row) {
            node.appendChild (app.element ('b', 'sym', row.symbol));
            var title = app.element ('span', '');
            title.appendChild (sideNode (row));
            title.appendChild (document.createTextNode (' ' + (row.type || 'order') + ((row.price !== undefined) ? ' at ' + price (row.price) : '')));
            node.appendChild (title);
            var pairs = [];
            if (row.triggerPrice !== undefined) {
                pairs.push ([ 'Trigger', price (row.triggerPrice) ]);
            }
            pairs.push ([ 'Filled', quantity (row.filled) + ((row.amount !== undefined) ? ' of ' + quantity (row.amount) : '') ]);
            pairs.push ([ 'Average', (row.average === undefined) ? '–' : price (row.average) ]);
            pairs.push ([ 'Cost', (row.cost === undefined) ? '–' : money (row.cost) ]);
            pairs.push ([ 'Fee', row.fee ? feeText (row.fee) : '–' ]);
            if (row.timeInForce) {
                pairs.push ([ 'Time in force', row.timeInForce ]);
            }
            pairs.push ([ 'Status', statusLabel (row) ]);
            pairs.push ([ 'Placed', (row.timestamp === undefined) ? '–' : app.dateTime (row.timestamp) ]);
            pairs.push ([ 'ID', row.id || '–' ]);
            if (row.clientOrderId) {
                pairs.push ([ 'Client ID', row.clientOrderId ]);
            }
            pairs.forEach (function (pair) { labelled (node, pair[0], pair[1]); });
            if (row.postOnly) {
                node.appendChild (app.element ('span', 'flag', 'Post-only'));
            }
            if (row.reduceOnly) {
                node.appendChild (app.element ('span', 'flag', 'Reduce-only'));
            }
        },
        fallbackArgs: function () {
            return { account: board.data.account, status: board.data.status, symbol: board.data.symbol };
        }
    };

    board = table.accountView (view);
    board.start ();
}) ();
</script>
</body>
</html>
