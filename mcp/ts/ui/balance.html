<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCXT balance</title>
<style>
/* @include shared.css */
/* @include account.css */
/* value: the number, and its share of the valued holdings as a bar — one hue, because this
   is magnitude and has no direction */
.val { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; }
.val .pct { min-width: 2.6em; text-align: right; color: var(--text-2); }
.share { position: relative; flex: none; width: 56px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.share i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
/* narrower hosts shed decoration first, then whole columns — the table never overflows */
@media (max-width: 599px) {
    thead .long { display: none; }
    thead .short { display: inline; }
    .share { width: 40px; }
    th, td, thead th { padding-left: 5px; padding-right: 5px; }
}
@media (max-width: 519px) {
    .share { display: none; }
    .name { max-width: 7.5em; }
}
@media (max-width: 439px) {
    .c-used { display: none; }
    .val .pct { display: none; }
    .name { max-width: 6em; }
}
@media (max-width: 379px) {
    body { font-size: 12px; }
    .c-free { display: none; }
    th, td, thead th { padding-left: 4px; padding-right: 4px; }
}
</style>
</head>
<body>
<div class="head">
    <div>
        <div class="title"><h1 id="heading">Balance</h1><span class="venue" id="venue"></span><span class="account" id="accountwrap" hidden><span class="name" id="account"></span><span class="env" id="env" hidden></span></span></div>
        <div class="hero" id="hero" hidden><span class="value" id="figure">–</span><span class="context" id="context"></span></div>
        <div class="asof" id="asof"></div>
    </div>
    <div class="controls">
        <button type="button" id="refresh" title="Fetch the latest balances" hidden>Refresh</button>
    </div>
</div>
<div class="board" id="board"></div>
<div class="readout" id="readout" aria-live="off" hidden></div>
<div class="note" id="note" hidden></div>
<div class="status" id="status" role="status">Waiting for data…</div>
<script>
/* @include bridge.js */
/* @include table.js */
</script>
<script>
(function () {
    'use strict';
    var app = window.ccxtApp;
    var table = window.ccxtTable;
    var text = table.format.text;
    var number = table.format.number;
    var time = table.format.time;
    var plural = table.format.plural;
    var price = table.format.price;
    var quantity = table.format.quantity;
    var money = table.format.money;
    var labelled = table.labelled;
    // the account view built from `view` at the end: board.data is the payload, board.rows
    // its normalized rows, board.nodes the elements of the page
    var board;

    var valued = 0; // sum of the positive values: the whole the share bars are parts of
    var unvalued = 0;

    function share (row) {
        return (row.value > 0 && valued > 0) ? row.value / valued : undefined;
    }

    function shareText (part) {
        if (part === undefined) {
            return '';
        }
        return (part < 0.01) ? '<1%' : Math.round (part * 100) + '%';
    }

    function amountCell (key) {
        return function (cell, row) {
            cell.textContent = quantity (row[key]);
            if (row[key] === undefined) {
                cell.classList.add ('missing');
            }
        };
    }

    var view = {
        name: 'balance',
        list: 'balances',
        tool: 'show_balance',
        noun: 'balances',
        hint: 'Point at, tap or focus a row for its price and share of the total.',
        columns: [
            { key: 'code', label: 'Asset', hint: 'Sort by asset', text: true, header: true, fill: function (cell, row) {
                var name = app.element ('span', 'name', row.code);
                name.title = row.code;
                cell.appendChild (name);
            } },
            { key: 'free', label: 'Free', hint: 'Sort by the amount available to trade or withdraw', className: 'c-free', fill: amountCell ('free') },
            { key: 'used', label: 'In orders', short: 'Used', hint: 'Sort by the amount held by open orders or as margin', className: 'c-used', fill: amountCell ('used') },
            { key: 'total', label: 'Total', hint: 'Sort by total amount', fill: amountCell ('total') },
            { key: 'value', label: 'Value', hint: 'Sort by value', className: 'c-value', unit: function () { return text (board.data.quote) || ''; }, fill: function (cell, row) {
                if (row.value === undefined) {
                    cell.textContent = '–';
                    cell.classList.add ('missing');
                    cell.title = 'No price available for this asset';
                    return;
                }
                var wrap = app.element ('span', 'val');
                var part = share (row);
                if (part !== undefined) {
                    var bar = app.element ('span', 'share');
                    bar.setAttribute ('aria-hidden', 'true');
                    var fill = document.createElement ('i');
                    fill.style.width = 'max(1px, ' + (part * 100).toFixed (2) + '%)';
                    bar.appendChild (fill);
                    wrap.appendChild (bar);
                    wrap.appendChild (app.element ('span', 'pct', shareText (part)));
                }
                wrap.appendChild (app.element ('span', '', money (row.value)));
                cell.appendChild (wrap);
            } }
        ],
        normalize: function (entry, index) {
            var row = { index: index, code: text (entry.code) || '–' };
            [ 'free', 'used', 'total', 'price', 'value' ].forEach (function (key) {
                row[key] = number (entry[key]);
            });
            // some venues report free and used only
            if (row.total === undefined && (row.free !== undefined || row.used !== undefined)) {
                row.total = number ((row.free || 0) + (row.used || 0));
            }
            if (row.value === undefined && row.total !== undefined && row.price !== undefined) {
                row.value = number (row.total * row.price);
            }
            row.par = entry.par === true;
            row.key = row.code;
            return row;
        },
        caption: function () {
            return 'Balances of account ' + (text (board.data.account) || '') + ' on ' + (text (board.data.exchangeName) || text (board.data.exchange) || 'the exchange') + '.';
        },
        header: function () {
            var quote = text (board.data.quote);
            var total = number (board.data.totalValue);
            var held = 0;
            var par = [];
            valued = 0;
            unvalued = 0;
            board.rows.forEach (function (row) {
                if (row.value > 0) {
                    valued += row.value;
                }
                if (row.total !== 0) {
                    held++;
                }
                if (row.value === undefined && row.total !== 0) {
                    unvalued++;
                }
                if (row.par && row.value !== undefined) {
                    par.push (row.code);
                }
            });
            if (!app.isNumber (valued)) {
                valued = 0;
            }
            board.nodes.hero.hidden = !board.rows.length;
            if (total !== undefined) {
                board.nodes.figure.textContent = '≈\u00a0' + money (total) + (quote ? ' ' + quote : '');
                // a total that leaves holdings out is not the account's worth: the headline
                // says so itself, the note below says how many
                board.nodes.context.textContent = ((unvalued > 0) ? 'partial value · ' + (held - unvalued) + ' of ' + plural (held, 'asset') + ' priced' : 'total value · ' + plural (board.rows.length, 'asset'));
            } else {
                // nothing could be priced: the count is the one honest headline
                board.nodes.figure.textContent = plural (board.rows.length, 'asset');
                board.nodes.context.textContent = 'no valuation available';
            }
            var stamp = time (board.data.timestamp);
            board.nodes.asof.textContent = (stamp === undefined) ? '' : 'as of ' + app.dateTime (stamp);
            var hidden = number (board.data.hiddenZeroBalances);
            var lines = [];
            if (hidden > 0) {
                lines.push (plural (Math.round (hidden), 'zero balance') + ' hidden');
            }
            if (total !== undefined && unvalued > 0) {
                lines.push (plural (unvalued, 'asset') + ' without a ' + (quote ? quote + ' ' : '') + 'price ' + ((unvalued === 1) ? 'is' : 'are') + ' not in the total');
            }
            if (total !== undefined && par.length > 0) {
                // no market between two dollar currencies on this venue: an assumption, named
                lines.push (par.join (', ') + ' counted 1:1 with ' + (quote || 'the quote currency') + ' (no market price here)');
            }
            board.setNote (lines);
        },
        empty: function () {
            return (number (board.data.hiddenZeroBalances) > 0) ? 'No non-zero balances.' : 'No balances.';
        },
        readout: function (node, row) {
            var quote = text (board.data.quote);
            node.appendChild (app.element ('b', 'sym', row.code));
            var suffix = quote ? ' ' + quote : '';
            [ [ 'Free', quantity (row.free) ], [ 'In orders', quantity (row.used) ], [ 'Total', quantity (row.total) ],
                [ 'Price', (row.price === undefined) ? '–' : price (row.price) + suffix + (row.par ? ' (assumed 1:1)' : '') ],
                [ 'Value', (row.value === undefined) ? '–' : money (row.value) + suffix ],
                [ 'Share', shareText (share (row)) || '–' ] ].forEach (function (pair) {
                labelled (node, pair[0], pair[1]);
            });
        },
        fallbackArgs: function () {
            return { account: board.data.account };
        }
    };

    board = table.accountView (view);
    board.start ();
}) ();
</script>
</body>
</html>
