:root {
  color-scheme: dark;
  font: 13px/1.5 'Inter', system-ui, sans-serif;
  /* CCXT Terminal surface, text, and chart colors. */
  --background: #030e16;
  --surface: #09131b;
  --surface-hover: #202a34;
  --text: #ffffff;
  --muted: #868d9c;
  --line: #28313c;
  --grid: #121e26;
  --focus: #65c6cc;
  --up: #089969;
  --down: #a6283d;
  --up-text: #60aa6c;
  --down-text: #fb7477;
  --volume: #364148;
  --watermark: #364855;
  background: var(--background);
  color: var(--text);
  scrollbar-color: var(--line) var(--background);
}
* { box-sizing: border-box; }
::selection { background: var(--focus); color: var(--background); }
body { margin: 0; }
main { padding: 12px 14px; }
header, .controls { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
header {
  justify-content: space-between;
  padding-bottom: 10px;
  margin-bottom: 9px;
  border-bottom: 1px solid var(--line);
}
header > div { min-width: 0; overflow-wrap: anywhere; }
h1 { font-size: 17px; font-weight: 600; line-height: 1.25; margin: 0; }
p { margin: 0; }
#market { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
#count, output, .status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#count { flex: 0 0 auto; }
.controls { margin: 8px 0 0; }
button, input {
  min-height: 32px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: inherit;
  font: inherit;
}
button { cursor: pointer; }
button:enabled:hover { background: var(--surface-hover); }
button:disabled { color: var(--muted); opacity: .65; cursor: default; }
button:focus-visible, input:focus-visible, .chart-track canvas:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}
input { min-width: 0; max-width: 100%; }
input::placeholder { color: var(--muted); opacity: 1; }
.chart-frame { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) 86px; }
.ccxt-watermark {
  position: absolute;
  z-index: -1;
  top: 50%;
  left: 50%;
  width: clamp(5.5rem, 31%, 9.75rem);
  height: auto;
  transform: translate(-50%, -50%);
  color: var(--watermark);
  pointer-events: none;
}
.chart-frame > .ccxt-watermark { top: 42%; left: calc((100% - 86px) / 2); }
.trade-table-frame > .ccxt-watermark {
  top: calc(50% + 16px);
  max-height: max(0px, calc(100% - 36px));
}
.chart-scroll { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; }
.chart-track { width: 100%; }
.chart-track canvas, .chart-axis { display: block; height: 410px; }
.chart-track canvas { position: sticky; left: 0; }
.chart-axis { width: 100%; border-left: 1px solid var(--grid); }
output { display: block; min-height: 3em; margin-top: 6px; }
.order-book-frame, .trade-table-frame {
  position: relative;
  isolation: isolate;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.order-book-frame > .ccxt-watermark, .trade-table-frame > .ccxt-watermark { width: clamp(6rem, 42%, 12rem); }
.order-book-scroll { max-height: 440px; overflow: auto; overscroll-behavior: contain; }
.order-book-scroll:focus-visible, .trade-table-frame .scroller:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.order-book, .trade-tape { border-collapse: separate; border-spacing: 0; }
.order-book th, .order-book td { padding: 5px 8px; text-align: right; }
.order-book th:first-child, .order-book td:first-child { text-align: left; }
.order-book thead th { z-index: 1; color: var(--text); background: var(--surface); }
.order-book td { border-bottom: 0; }
.order-book .depth-level {
  background: linear-gradient(to right, var(--depth-fill) var(--depth), transparent var(--depth));
}
.order-book .asks {
  --depth-fill: color-mix(in srgb, var(--down) 28%, transparent);
  --level-price: var(--down-text);
}
.order-book .bids {
  --depth-fill: color-mix(in srgb, var(--up) 24%, transparent);
  --level-price: var(--up-text);
}
.order-book .depth-level td:first-child { color: var(--level-price); }
.order-book .depth-level:hover td { background: color-mix(in srgb, var(--text) 6%, transparent); }
.order-book .book-spread th, .order-book .book-spread td {
  position: static;
  background: var(--surface-hover);
  color: var(--text);
  border-block: 1px solid var(--line);
}
.scroller { max-height: 360px; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#result > input {
  margin-bottom: 8px;
  background: #000;
  color: #fff;
}
#result > input::placeholder { color: inherit; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 9px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { background: var(--surface); color: var(--muted); position: sticky; top: 0; }
th button { min-height: 24px; border: 0; padding: 0 2px; font-weight: 600; }
th.numeric, td.numeric { text-align: right; }
td.positive { color: var(--up-text); }
td.negative { color: var(--down-text); }
.trade-table-frame .scroller { max-height: 440px; border: 0; overscroll-behavior: contain; }
.trade-tape th, .trade-tape td { padding: 5px 8px; border-bottom: 0; }
.trade-tape tbody tr:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
@media (max-width: 400px) {
  .trade-tape th, .trade-tape td { padding-inline: 5px; font-size: 12px; }
}
.trade-tape th {
  z-index: 1;
  background: #000;
  color: #fff;
  border-bottom: 1px solid var(--grid);
}
.trade-tape th button { background: transparent; padding-inline: 0; }
.trade-tape th button:enabled:hover { background: var(--surface-hover); }
.trade-tape .trade-time { color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
tbody tr:hover { background: var(--surface-hover); }
td[data-side="buy"], td[data-side="bids"] { color: var(--up-text); }
td[data-side="sell"], td[data-side="asks"] { color: var(--down-text); }
pre { margin: 0; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; background: var(--surface); border-radius: 4px; }
#result > .status { margin-top: 8px; }
</style>
</head>
<body>
  <main>
    <header><div><p id="market" hidden></p><h1 id="title">CCXT market data</h1></div><span id="count"></span></header>
    <section id="result" aria-label="Market data"><p role="status">Waiting for market data…</p></section>
  </main>
  <template id="ccxt-watermark">
<svg class="ccxt-watermark" aria-hidden="true" focusable="false" width="389" height="389" viewBox="0 0 389 389" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M166.67 0H0.0102539V166.66H166.67V111.11H55.5603V55.55H166.67V0Z" fill="currentColor" />
  <path d="M388.89 0H222.23V166.66H388.89V111.11H277.78V55.55H388.89V0Z" fill="currentColor" />
  <path
    d="M55.56 277.77C55.5 259.27 55.61 240.71 55.56 222.21H0V277.77C18.5 277.82 37.06 277.71 55.56 277.77C55.62 296.26 55.62 314.83 55.56 333.33C37.06 333.39 18.5 333.28 0 333.33V388.89H55.56C55.61 370.39 55.5 351.83 55.56 333.33C74.05 333.27 92.62 333.27 111.12 333.33C111.18 351.83 111.07 370.39 111.12 388.89H166.68V333.33C148.18 333.28 129.62 333.39 111.12 333.33C111.06 314.84 111.06 296.27 111.12 277.77C129.62 277.71 148.18 277.82 166.68 277.77V222.21H111.12C111.07 240.71 111.18 259.27 111.12 277.77C92.63 277.83 74.06 277.83 55.56 277.77Z"
    fill="currentColor" />
  <path d="M388.89 222.22H222.23V277.77H277.78V388.88H333.34V277.77H388.89V222.22Z"
    fill="currentColor" />
</svg>
  </template>
  <script>
const root = document.querySelector('#result');
const number = new Intl.NumberFormat(undefined, { maximumSignificantDigits: 10 });
const priceNumber = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const date = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short', timeZone: 'UTC' });
const valueText = (value) => typeof value === 'number' ? number.format(value) : String(value ?? '—');
const element = (tag, text) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
};

const titles = {
  get_ohlcv: 'Candlesticks',
  get_trades: 'Recent trades',
  get_tickers: 'Tickers',
  get_orderbook: 'Order book',
  get_funding_rates: 'Funding rates',
  search_markets: 'Markets',
  list_exchanges: 'Exchanges',
};
const isScalar = (value) => ['string', 'number', 'boolean'].includes(typeof value);
const tableFields = (record) => Object.fromEntries(Object.entries(record).filter(([, value]) => isScalar(value)));

const tableColumns = {
  get_trades: [['datetime', 'Time (UTC)'], ['price', 'Price'], ['amount', 'Size'], ['cost', 'Total']],
  get_tickers: [['symbol', 'Market'], ['last', 'Last'], ['percentage', 'Change (24h)'], ['bid', 'Bid'], ['ask', 'Ask'], ['high', 'High'], ['low', 'Low'], ['quoteVolume', 'Quote volume'], ['baseVolume', 'Base volume'], ['datetime', 'Time (UTC)']],
  get_funding_rates: [['symbol', 'Market'], ['fundingRate', 'Funding rate'], ['fundingDatetime', 'Funding time (UTC)'], ['nextFundingRate', 'Next rate'], ['nextFundingDatetime', 'Next funding (UTC)'], ['interval', 'Interval'], ['markPrice', 'Mark price'], ['indexPrice', 'Index price']],
  search_markets: [['symbol', 'Market'], ['type', 'Type'], ['active', 'Status'], ['base', 'Base'], ['quote', 'Quote'], ['settle', 'Settlement'], ['maker', 'Maker fee'], ['taker', 'Taker fee'], ['expiry', 'Expiry (UTC)'], ['strike', 'Strike'], ['optionType', 'Option type'], ['id', 'Exchange ID']],
  list_exchanges: [['id', 'Exchange ID'], ['name', 'Exchange'], ['certified', 'Certified'], ['ws', 'WebSocket'], ['prediction', 'Prediction']],
};
const rateFormat = new Intl.NumberFormat(undefined, { style: 'percent', maximumFractionDigits: 6, signDisplay: 'exceptZero' });
const decimalRateKeys = new Set(['fundingRate', 'nextFundingRate', 'maker', 'taker']);
const dateKeys = new Set(['datetime', 'fundingDatetime', 'nextFundingDatetime', 'expiry']);
const tableTime = new Intl.DateTimeFormat(undefined, {
  timeZone: 'UTC', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
});
const tradeTime = new Intl.DateTimeFormat(undefined, {
  timeZone: 'UTC', hour: '2-digit', minute: '2-digit', second: '2-digit',
  fractionalSecondDigits: 3, hourCycle: 'h23',
});
function tableValue(value, key, tool) {
  if (value == null) return '—';
  if (typeof value === 'number' && (decimalRateKeys.has(key) || key === 'percentage')) {
    return rateFormat.format(key === 'percentage' ? value / 100 : value);
  }
  if (dateKeys.has(key)) {
    const timestamp = typeof value === 'number' ? value : Date.parse(value);
    if (Number.isFinite(timestamp)) return (tool === 'get_trades' ? tradeTime : tableTime).format(timestamp);
  }
  if (typeof value === 'boolean') return key === 'active' ? (value ? 'Active' : 'Inactive') : (value ? 'Yes' : 'No');
  if (key === 'side') return String(value).replace(/^./, (letter) => letter.toUpperCase());
  return valueText(value);
}

function parseEnvelope(result) {
  const text = result.content?.find((item) => item.type === 'text')?.text;
  if (result.structuredContent) return result.structuredContent;
  try {
    return JSON.parse(text);
  } catch {
    return { ok: false, error: { message: text } };
  }
}

let disposeChart = () => {};
function render(result) {
  disposeChart();
  disposeChart = () => {};
  root.replaceChildren();
  const { ok, data, meta, error } = parseEnvelope(result);
  const isOhlcv = meta?.columns?.[0] === 'timestamp' && meta?.columns?.[5] === 'volume';
  const isOrderBook = Array.isArray(data?.bids) && Array.isArray(data?.asks);
  const tool = result._meta?.marketWidget ?? (isOhlcv ? 'get_ohlcv' : isOrderBook ? 'get_orderbook' : undefined);
  const market = document.querySelector('#market');
  market.textContent = [meta?.exchange, meta?.symbol ?? data?.symbol, meta?.timeframe].filter(Boolean).join(' · ');
  market.hidden = !market.textContent;
  document.querySelector('#title').textContent = Object.hasOwn(titles, tool) ? titles[tool] : 'CCXT market data';
  const count = document.querySelector('#count');
  count.textContent = '';
  if (result.isError || ok !== true) {
    root.append(element('p', error?.message || 'No market data was returned.'));
    return;
  }

  if (tool === 'get_ohlcv') {
    const candles = (Array.isArray(data) ? data : [])
      .filter((row) => Array.isArray(row) && row.length >= 5
        && row.slice(0, 5).every(Number.isFinite) && Math.abs(row[0]) <= 8.64e15)
      .sort(([left], [right]) => left - right);
    count.textContent = number.format(candles.length) + ' candles';
    if (candles.length) drawChart(candles);
  } else if (isOrderBook) {
    const levels = drawOrderBook(data);
    count.textContent = number.format(levels) + ' levels';
  } else if (Array.isArray(data)) {
    const rows = data.filter((row) => row && typeof row === 'object' && !Array.isArray(row)).map((row) => tableFields({
      ...row,
      datetime: row.datetime ?? row.timestamp,
      fundingDatetime: row.fundingDatetime ?? row.fundingTimestamp,
      nextFundingDatetime: row.nextFundingDatetime ?? row.nextFundingTimestamp,
    }));
    count.textContent = number.format(rows.length) + ' records';
    if (rows.length) drawTable(rows, tool, meta?.symbol);
  } else if (!meta?.truncated && data != null) {
    root.append(element('pre', JSON.stringify(data, null, 2)));
  }
  if (!root.firstChild && !meta?.truncated) root.append(element('p', 'No records matched this request.'));
  if (meta?.notice && (tool !== 'get_ohlcv' || meta.truncated)) {
    const notice = element('p', meta.notice);
    notice.className = 'status';
    root.append(notice);
  }
}

function drawOrderBook(book) {
  const depthNumber = new Intl.NumberFormat(undefined, { maximumSignificantDigits: 15 });
  const validLevels = (levels, direction) => levels
    .filter((level) => Array.isArray(level) && Number.isFinite(level[0]) && Number.isFinite(level[1]) && level[1] > 0)
    .sort(([a], [b]) => direction * (a - b));
  const asks = validLevels(book.asks, 1);
  const bids = validLevels(book.bids, -1);
  if (!asks.length && !bids.length) return 0;
  const [base, quote] = (book.symbol ?? '').split(':')[0].split('/');
  const sizeUnit = book.symbol?.includes(':') ? '' : base;
  const column = (label, unit) => unit ? label + ' (' + unit + ')' : label;
  const frame = element('div');
  frame.className = 'order-book-frame';
  const scroller = element('div');
  scroller.className = 'order-book-scroll';
  scroller.tabIndex = 0;
  scroller.setAttribute('role', 'region');
  scroller.setAttribute('aria-label', 'Order book depth');
  const table = element('table');
  table.className = 'order-book';
  const caption = table.createCaption();
  caption.className = 'visually-hidden';
  caption.textContent = 'Order book depth. Asks above the spread, bids below.';
  const headings = table.createTHead().insertRow();
  for (const label of [column('Price', quote), column('Size', sizeUnit), column('Total', sizeUnit)]) {
    const heading = element('th', label);
    heading.scope = 'col';
    headings.append(heading);
  }
  const totalSize = (levels) => levels.reduce((total, [, size]) => total + size, 0);
  const maxDepth = Math.max(totalSize(asks), totalSize(bids));
  function appendSide(levels, side) {
    const body = table.createTBody();
    body.className = side;
    body.setAttribute('aria-label', side === 'asks' ? 'Asks' : 'Bids');
    let total = 0;
    const rows = levels.map(([price, size]) => {
      total += size;
      const row = element('tr');
      row.className = 'depth-level';
      row.style.setProperty('--depth', (100 * total / maxDepth) + '%');
      row.append(...[price, size, total].map((value) => element('td', depthNumber.format(value))));
      return row;
    });
    if (side === 'asks') rows.reverse();
    body.append(...rows);
  }
  appendSide(asks, 'asks');
  const spread = table.createTBody().insertRow();
  spread.className = 'book-spread';
  const label = element('th', 'Spread');
  label.scope = 'row';
  spread.append(label);
  const bestAsk = asks[0]?.[0];
  const bestBid = bids[0]?.[0];
  const gap = bestAsk != null && bestBid != null ? bestAsk - bestBid : null;
  const decimalPlaces = (value) => {
    const [coefficient, exponent = 0] = String(value).split('e');
    return Math.max(0, (coefficient.split('.')[1]?.length ?? 0) - Number(exponent));
  };
  const gapText = gap == null ? '—' : new Intl.NumberFormat(undefined, {
    maximumFractionDigits: Math.min(20, Math.max(decimalPlaces(bestAsk), decimalPlaces(bestBid))),
  }).format(gap);
  const percent = gap != null && bestAsk > 0 ? rateFormat.format(gap / bestAsk).replace(/^\+/, '') : '—';
  spread.append(element('td', gapText), element('td', percent));
  appendSide(bids, 'bids');
  scroller.append(table);
  frame.append(document.querySelector('#ccxt-watermark').content.cloneNode(true), scroller);
  root.append(frame);
  scroller.scrollTop = spread.getBoundingClientRect().top - scroller.getBoundingClientRect().top
    - (scroller.clientHeight - spread.offsetHeight) / 2;
  return asks.length + bids.length;
}

function drawTable(rows, tool, symbol) {
  const isTradeTape = tool === 'get_trades';
  const [base, quote] = (symbol ?? rows[0].symbol ?? '').split(':')[0].split('/');
  const units = { price: quote, amount: base, cost: quote };
  const keysPresent = [...new Set(rows.flatMap(Object.keys))];
  const columns = (tableColumns[tool] ?? keysPresent.map((key) => [key, key]))
    .filter(([key]) => keysPresent.includes(key))
    .map(([key, label]) => [key, isTradeTape && units[key] ? label + ' (' + units[key] + ')' : label]);
  const keys = columns.map(([key]) => key);
  const numeric = new Set(keys.filter((key) => !dateKeys.has(key) && rows.some((row) => typeof row[key] === 'number')));
  const pageSize = 25;
  const search = element('input');
  search.type = 'search';
  search.placeholder = isTradeTape ? 'Search trades' : 'Search records';
  search.setAttribute('aria-label', search.placeholder);
  const scroller = element('div');
  scroller.className = 'scroller';
  const table = element('table');
  if (isTradeTape) {
    table.className = 'trade-tape';
    scroller.tabIndex = 0;
    scroller.setAttribute('role', 'region');
    scroller.setAttribute('aria-label', 'Recent trades');
  }
  const headings = table.createTHead().insertRow();
  const body = table.createTBody();
  const controls = element('div');
  controls.className = 'controls';
  const previous = element('button', 'Previous');
  const next = element('button', 'Next');
  const status = element('span');
  status.className = 'status';
  status.setAttribute('role', 'status');
  controls.append(previous, next, status);
  scroller.append(table);
  root.append(search);
  if (isTradeTape) {
    const frame = element('div');
    frame.className = 'trade-table-frame';
    frame.append(document.querySelector('#ccxt-watermark').content.cloneNode(true), scroller);
    root.append(frame);
  } else {
    root.append(scroller);
  }
  root.append(controls);
  let page = 0;
  let sortBy = tool === 'get_trades' && keys.includes('datetime') ? 'datetime' : undefined;
  let direction = sortBy ? -1 : 1;
  const headers = columns.map(([key, label]) => {
    const header = element('th');
    header.scope = 'col';
    if (numeric.has(key)) header.className = 'numeric';
    const button = element('button', label);
    button.onclick = () => {
      direction = sortBy === key ? -direction : 1;
      sortBy = key;
      page = 0;
      update();
    };
    header.append(button);
    headings.append(header);
    return header;
  });
  function update() {
    const query = search.value.trim().toLowerCase();
    const searchKeys = isTradeTape ? [...keys, 'side', 'id'] : keys;
    const filtered = rows.filter((row) => searchKeys.some((key) => String(row[key] ?? '').toLowerCase().includes(query) ||
      tableValue(row[key], key, tool).toLowerCase().includes(query)));
    if (sortBy) filtered.sort((left, right) => {
      let a = left[sortBy];
      let b = right[sortBy];
      if (dateKeys.has(sortBy)) {
        a = typeof a === 'number' ? a : (Date.parse(a) || null);
        b = typeof b === 'number' ? b : (Date.parse(b) || null);
      }
      if (a == null || b == null) return (a == null) - (b == null);
      return direction * (typeof a === 'number' && typeof b === 'number'
        ? a - b : String(a ?? '').localeCompare(String(b ?? ''), undefined, { numeric: true }));
    });
    headers.forEach((header, index) => {
      const active = keys[index] === sortBy;
      header.setAttribute('aria-sort', active ? (direction === 1 ? 'ascending' : 'descending') : 'none');
      header.firstChild.textContent = columns[index][1] + (active ? (direction === 1 ? ' ↑' : ' ↓') : '');
    });
    body.replaceChildren();
    scroller.scrollTop = 0;
    const offset = page * pageSize;
    for (const row of filtered.slice(offset, offset + pageSize)) {
      const tr = body.insertRow();
      for (const key of keys) {
        const cell = tr.insertCell();
        const value = row[key];
        cell.textContent = tableValue(value, key, tool);
        if (numeric.has(key)) cell.className = 'numeric';
        if (key === 'side') cell.dataset.side = value;
        if (isTradeTape && key === 'price' && ['buy', 'sell'].includes(row.side)) {
          cell.dataset.side = row.side;
          const side = element('span', row.side === 'buy' ? 'Buy ' : 'Sell ');
          side.className = 'visually-hidden';
          cell.prepend(side);
        }
        if (isTradeTape && key === 'datetime' && value != null) {
          cell.className = 'trade-time';
          const timestamp = typeof value === 'number' ? value : Date.parse(value);
          if (Number.isFinite(timestamp)) cell.title = tableTime.format(timestamp) + ' UTC';
        }
        if (key === 'percentage' || key === 'fundingRate' || key === 'nextFundingRate') {
          if (value > 0) cell.classList.add('positive');
          if (value < 0) cell.classList.add('negative');
        }
      }
    }
    previous.disabled = page === 0;
    next.disabled = offset + pageSize >= filtered.length;
    status.textContent = filtered.length
      ? (offset + 1) + '–' + Math.min(offset + pageSize, filtered.length) + ' of ' + filtered.length
      : 'No matching records';
  }
  search.oninput = () => { page = 0; update(); };
  previous.onclick = () => { page--; update(); };
  next.onclick = () => { page++; update(); };
  update();
}

function drawChart(candles) {
  const frame = element('div');
  frame.className = 'chart-frame';
  const viewport = element('div');
  viewport.className = 'chart-scroll';
  const track = element('div');
  track.className = 'chart-track';
  const plot = element('canvas');
  plot.tabIndex = 0;
  plot.setAttribute('aria-label', 'Candlestick price and volume chart. Scroll horizontally for older candles, or use the left and right arrow keys to inspect candles.');
  const axis = element('canvas');
  axis.className = 'chart-axis';
  axis.setAttribute('aria-hidden', 'true');
  const details = element('output');
  details.setAttribute('aria-live', 'polite');
  track.append(plot);
  viewport.append(track);
  frame.append(document.querySelector('#ccxt-watermark').content.cloneNode(true), viewport, axis);
  root.append(frame, details);

  const height = 410;
  const priceTop = 24;
  const priceBottom = 301;
  const volumeTop = 330;
  const volumeBottom = 381;
  const scale = window.devicePixelRatio || 1;
  const interval = (candles.at(-1)[0] - candles[0][0]) / Math.max(1, candles.length - 1);
  const tickFormat = interval >= 86400000
    ? { month: 'short', day: 'numeric' }
    : { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
  const time = new Intl.DateTimeFormat(undefined, { ...tickFormat, timeZone: 'UTC' });
  const colors = {};
  let selected = -1;
  let offset = 0;
  let spacing = 0;
  let width = 0;
  let frameId = 0;
  let mounted = false;

  function themeColors() {
    const probe = element('span');
    probe.hidden = true;
    frame.append(probe);
    for (const name of ['up', 'down', 'muted', 'grid', 'volume']) {
      probe.style.color = 'var(--' + name + ')';
      colors[name] = getComputedStyle(probe).color;
    }
    probe.remove();
  }

  function context(canvas, cssWidth) {
    const pixelWidth = Math.round(cssWidth * scale);
    const pixelHeight = Math.round(height * scale);
    if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
    if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, cssWidth, height);
    ctx.font = '12px ' + getComputedStyle(frame).fontFamily;
    ctx.fillStyle = colors.muted;
    return ctx;
  }

  function gridLine(ctx, x1, y1, x2, y2, color = colors.grid) {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function draw() {
    frameId = 0;
    if (!width || !spacing) return;
    offset = viewport.scrollLeft;
    const start = Math.floor(offset / spacing);
    const end = Math.min(candles.length, Math.ceil((offset + width) / spacing));
    const visible = candles.slice(start, end);
    const high = Math.max(...visible.map(([, open, peak, , close]) => Math.max(open, peak, close)));
    const low = Math.min(...visible.map(([, open, , trough, close]) => Math.min(open, trough, close)));
    const topVolume = Math.max(0, ...visible.map((row) => row[5] ?? 0));
    const padding = (high - low || Math.abs(high) || 1) * .035;
    const priceY = (price) => priceTop + (high + padding - price) / (high - low + 2 * padding) * (priceBottom - priceTop);
    const plotX = (index) => (index + .5) * spacing - offset;
    const ctx = context(plot, width);
    const labels = context(axis, axis.clientWidth);
    const labelWidth = axis.clientWidth - 10;

    labels.fillText('Price', 5, 15);
    labels.fillText('Volume', 5, volumeTop - 8);
    labels.fillText('UTC', 5, height - 8);
    for (let step = 0; step <= 4; step++) {
      const price = low - padding + (high - low + 2 * padding) * step / 4;
      const y = priceY(price);
      gridLine(ctx, 0, y, width, y);
      labels.fillText(priceNumber.format(price), 5, y + 4, labelWidth);
    }
    gridLine(ctx, 0, volumeBottom, width, volumeBottom);
    labels.fillText(valueText(topVolume), 5, volumeTop + 5, labelWidth);
    if (topVolume > 0) labels.fillText('0', 5, volumeBottom + 4);
    const bodyWidth = Math.min(14, spacing * .65);
    visible.forEach(([, open, high, low, close, volume], position) => {
      const x = plotX(start + position);
      const up = close >= open;
      const color = up ? colors.up : colors.down;
      gridLine(ctx, x, priceY(high), x, priceY(low), color);
      ctx.fillStyle = color;
      ctx.fillRect(x - bodyWidth / 2, Math.min(priceY(open), priceY(close)), bodyWidth, Math.max(2, Math.abs(priceY(open) - priceY(close))));
      if (topVolume > 0 && volume > 0) {
        const bar = volume / topVolume * (volumeBottom - volumeTop);
        ctx.fillStyle = colors.volume;
        ctx.fillRect(x - bodyWidth / 2, volumeBottom - bar, bodyWidth, bar);
      }
    });

    ctx.fillStyle = colors.muted;
    ctx.textAlign = 'center';
    const tickEvery = Math.max(1, Math.ceil(62 / spacing));
    for (let index = Math.ceil(start / tickEvery) * tickEvery; index < end; index += tickEvery) {
      const x = plotX(index);
      if (x >= 27 && x <= width - 27) ctx.fillText(time.format(candles[index][0]), x, height - 8);
    }
    const inspected = selected >= start && selected < end;
    if (inspected) {
      const x = plotX(selected);
      gridLine(ctx, x, priceTop, x, volumeBottom, colors.muted);
    }
    const [timestamp, open, highPrice, lowPrice, close, volume] = candles[inspected ? selected : end - 1];
    details.textContent = [
      date.format(timestamp) + ' UTC', 'Open ' + priceNumber.format(open), 'High ' + priceNumber.format(highPrice),
      'Low ' + priceNumber.format(lowPrice), 'Close ' + priceNumber.format(close), 'Volume ' + valueText(volume),
    ].join(' · ');
  }

  function scheduleDraw() {
    if (!frameId) frameId = requestAnimationFrame(draw);
  }

  function resize() {
    const atLatest = !mounted || offset + width >= spacing * candles.length - 2;
    width = viewport.clientWidth;
    if (!width) return;
    const candlesPerView = Math.max(50, Math.floor(width / 10));
    track.style.minWidth = Math.ceil(width * candles.length / candlesPerView) + 'px';
    plot.style.width = width + 'px';
    spacing = track.clientWidth / candles.length;
    if (atLatest) viewport.scrollLeft = viewport.scrollWidth;
    mounted = true;
    scheduleDraw();
  }

  viewport.addEventListener('scroll', scheduleDraw, { passive: true });
  plot.onpointermove = (event) => {
    selected = Math.min(candles.length - 1, Math.max(0, Math.floor((viewport.scrollLeft + event.offsetX) / spacing)));
    scheduleDraw();
  };
  plot.onpointerleave = () => { selected = -1; scheduleDraw(); };
  plot.onkeydown = (event) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key) || !spacing) return;
    event.preventDefault();
    const lastVisible = Math.min(candles.length - 1, Math.ceil((viewport.scrollLeft + width) / spacing) - 1);
    const from = selected >= 0 ? selected : lastVisible;
    if (event.key === 'Home') selected = 0;
    else if (event.key === 'End') selected = candles.length - 1;
    else selected = Math.max(0, Math.min(candles.length - 1, from + (event.key === 'ArrowLeft' ? -1 : 1)));
    const left = selected * spacing;
    const right = left + spacing;
    if (left < viewport.scrollLeft) viewport.scrollLeft = left;
    if (right > viewport.scrollLeft + width) viewport.scrollLeft = right - width;
    scheduleDraw();
  };
  const observer = new ResizeObserver(resize);
  observer.observe(viewport);
  disposeChart = () => {
    observer.disconnect();
    cancelAnimationFrame(frameId);
  };
  themeColors();
  resize();
  document.fonts.ready.then(() => {
    if (frame.isConnected) scheduleDraw();
  });
}

const send = (message) => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
let initialized = false;
window.addEventListener('message', (event) => {
  const message = event.data;
  if (event.source !== window.parent || message?.jsonrpc !== '2.0') return;
  if (message.id === 1 && message.result?.protocolVersion && !initialized) {
    initialized = true;
    send({ method: 'ui/notifications/initialized' });
    const observer = new ResizeObserver(([entry]) =>
      send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(entry.contentRect.height) } }));
    observer.observe(document.body);
  }
  if (!initialized) return;
  if (message.method === 'ui/notifications/tool-result') render(message.params);
  if (message.method === 'ui/resource-teardown') {
    disposeChart();
    send({ id: message.id, result: {} });
  }
});
if (window.parent !== window) {
  send({
    id: 1, method: 'ui/initialize',
    params: { appInfo: { name: 'CCXT market data', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' },
  });
}
</script>
</body>
