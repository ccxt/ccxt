# nginx server {} part for the hosted CCXT MCP server: proxies its public paths, and
# nothing else, to the container (docker-compose.yml binds it to 127.0.0.1:8080).
# Install: /etc/nginx/snippets/ccxt-mcp-locations.conf, and inside the existing
#   server { listen 443 ssl; server_name docs.ccxt.com; ... }
# add `include /etc/nginx/snippets/ccxt-mcp-locations.conf;` and, in that server block,
# `client_header_timeout 10s;` (nginx does not allow it inside a location).
# Needs ccxt-mcp-http.conf in the http {} context. Then: nginx -t && systemctl reload nginx
#
# /healthz and /readyz are deliberately NOT proxied: they are for the machine itself
# (curl http://127.0.0.1:8080/readyz) and the container health check.

# The MCP endpoint. Exact match: /mcp only (no /mcp/anything).
location = /mcp {
    proxy_pass http://ccxt_mcp_hosted;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # the app validates Host against its allowlist: pass it through unchanged
    proxy_set_header Host $host;
    # the app trusts X-Real-IP (TRUSTED_PROXY=nginx-x-real-ip): nginx overwrites whatever
    # the client sent, so the value is always the address nginx saw
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # correlates the access log below with the app's request lines (echoed as X-Request-Id)
    proxy_set_header X-Request-Id $request_id;
    access_log /var/log/nginx/ccxt-mcp.log ccxt_mcp;

    # Streamable HTTP: answers may be SSE streams (2025-era clients, subscriptions/listen),
    # so responses are not buffered. Requests are: bodies are at most 256 KB, and a client
    # trickling one then holds only an nginx connection (cut by client_body_timeout), never
    # one of the app's
    proxy_buffering off;
    proxy_request_buffering on;
    client_body_timeout 10s;
    proxy_cache off;
    gzip off;
    # above the hosts' tool-call limit (Claude: 240 s) and the app's own deadline (20 s);
    # listen streams send a keep-alive comment every 15 s
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 5s;

    # the app caps bodies at 256 KB too; nginx refuses larger ones before they reach it
    client_max_body_size 256k;

    # per client address (zones in ccxt-mcp-http.conf): a few open connections, and a
    # request rate above any real host's (the app's own per-client budget is lower)
    limit_conn ccxt_mcp_conn 20;
    limit_req zone=ccxt_mcp_req burst=40 nodelay;
    limit_conn_status 429;
    limit_req_status 429;

    # while the container is being recreated (an upgrade) nothing listens on 8080: answer
    # like the app does while draining, a JSON-RPC 503 with Retry-After, not nginx's HTML 502
    error_page 502 504 = @ccxt_mcp_restarting;

    # never cached: proxy_cache is off here and the app sends Cache-Control: no-store
}

location @ccxt_mcp_restarting {
    access_log /var/log/nginx/ccxt-mcp.log ccxt_mcp;
    default_type application/json;
    add_header Retry-After 5 always;
    add_header Cache-Control no-store always;
    return 503 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"server is restarting, retry shortly"}}';
}

# OpenAI directory domain verification (plain-text token; 404 until OPENAI_APPS_CHALLENGE is set)
location = /.well-known/openai-apps-challenge {
    proxy_pass http://ccxt_mcp_hosted;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 1k;
    access_log /var/log/nginx/ccxt-mcp.log ccxt_mcp;
    limit_req zone=ccxt_mcp_req burst=10 nodelay;
}

# Reserved for phase 2 (OAuth Protected Resource Metadata, RFC 9728). The app answers 404
# today, which tells clients the server is authless; proxying it now means phase 2 needs
# no nginx change.
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://ccxt_mcp_hosted;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 1k;
    access_log /var/log/nginx/ccxt-mcp.log ccxt_mcp;
    limit_req zone=ccxt_mcp_req burst=10 nodelay;
}
