# nginx http {} context for the hosted CCXT MCP server on docs.ccxt.com.
# Install: /etc/nginx/conf.d/ccxt-mcp-http.conf (conf.d is included inside http {}).
# The server {} part is ccxt-mcp-locations.conf. Then: nginx -t && systemctl reload nginx
#
# Capacity: every subscriptions/listen stream holds two nginx connections (client and
# upstream) for as long as the client keeps it, next to the docs site's own traffic. Keep
# worker_processes x worker_connections comfortably above 2 x MAX_SUBSCRIPTIONS (200) plus
# the docs load: e.g. `events { worker_connections 4096; }` and `worker_rlimit_nofile 8192;`
# in nginx.conf (Ubuntu's stock value, 768 per worker, is too small).

# the port is HOST_PORT from .env (default 8080): change both together
upstream ccxt_mcp_hosted {
    server 127.0.0.1:8080;
    keepalive 32;
    # keep idle upstream connections for less time than the app's keepAliveTimeout (65 s)
    keepalive_timeout 60s;
}

# per client address: open connections and request rate on the proxied paths. The app has
# its own per-client limits, but it applies them only to complete requests; these stop one
# address from holding nginx's (shared with the docs site) connections.
#
# Host egress addresses are exempt: every Claude user reaches this server from Anthropic's
# few addresses, and ChatGPT's users from OpenAI's, so a per-address nginx limit there would
# cap the whole host's users at once (about 20 open live views behind one address), and
# answer them with nginx's HTML 429 instead of the app's in-band refusals. The app budgets
# those addresses itself (HOST_RATE_LIMIT_*, LIVE_HOST_RATE_LIMIT_*, per ChatGPT user). An
# empty key is not counted by limit_conn_zone / limit_req_zone.
