    1 "";
    default $binary_remote_addr;
}
limit_conn_zone $ccxt_mcp_limit_key zone=ccxt_mcp_conn:10m;
limit_req_zone $ccxt_mcp_limit_key zone=ccxt_mcp_req:10m rate=10r/s;

# Access log for the proxied paths. No $remote_addr: the published privacy text promises no
# IP addresses in logs (the app rate-limits on them in memory only). $request_id joins
# these lines to the app's (the app echoes it as X-Request-Id). $uri, not $request_uri, so
# no query string is written.
log_format ccxt_mcp '$time_iso8601 $request_id "$request_method $uri" $status $body_bytes_sent $request_time $upstream_response_time';
