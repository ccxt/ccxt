# mcp.ccxt.com: the hosted CCXT MCP server on its own name (same container as docs.ccxt.com/mcp)
#
# Install once (README, Deploy): /etc/nginx/sites-available/mcp.ccxt.com, linked from
# sites-enabled. It needs ccxt-mcp-http.conf and the ccxt-mcp-locations.conf snippet, which the
# deploy installs, and the app's ALLOWED_HOSTS must list mcp.ccxt.com (.env). The certificate
# comes from certbot: with only the port 80 server below enabled,
#   certbot certonly --webroot -w /var/www/certbot -d mcp.ccxt.com --deploy-hook "systemctl reload nginx"
# then enable this whole file; certbot.timer renews it.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.ccxt.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.ccxt.com;

    # Let's Encrypt via certbot (webroot /var/www/certbot); certbot.timer renews it and its
    # deploy hook reloads nginx
    ssl_certificate /etc/letsencrypt/live/mcp.ccxt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ccxt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_header_timeout 10s;

    # /mcp, the OpenAI domain challenge and the protected-resource metadata: the same
    # locations docs.ccxt.com serves, proxied to the same container
    include snippets/ccxt-mcp-locations.conf;

    # the bare https://mcp.ccxt.com is the endpoint too: MCP POSTs to / go to /mcp; a browser
    # opening it lands on the docs
    location = / {
        if ($request_method = POST) { rewrite ^ /mcp last; }
        return 302 https://docs.ccxt.com/docs/mcp;
    }
    location / { return 302 https://docs.ccxt.com/docs/mcp; }
}
