name: MCP Release

# Publishes the ccxt-mcp sub-package to npm, mirroring the main release workflow
# (maintainer allowlist, Node 24, npm publish with provenance via OIDC).
# The version is bumped by the workflow itself — same `build/smart-bump.sh` + commit-back
# pattern as release.yml — so a release is a run of this workflow, never a hand-edited package.json.
# One run ships all three channels: npm, the MCP registry entry, and the .mcpb bundle.
# npm auth uses OIDC trusted publishing — configure a trusted publisher for the `ccxt-mcp`
# package on npmjs pointing at this workflow (one-time setup).
#
# It runs after every successful ccxt release, and on manual dispatch. Each run floors the
# `ccxt` dependency at the newest ccxt release. Without the follow-up release, ccxt updates
# never reach existing users: npx keeps the ccxt resolved at first install until the
# ccxt-mcp version itself changes, and the .mcpb bundle freezes ccxt at build time.
# A ccxt release that reached npm but failed in a later step (as 4.5.81 did) triggers
# nothing here; dispatch this workflow by hand after one.
#
# Only the publish job uses the Prod environment, so a release needs one approval.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release workflow"]
    types:
      - completed

permissions:
  id-token: write
  contents: write

# One release at a time, oldest first. `queue: max` keeps every pending run (the default,
# `single`, cancels an older pending run when a newer one arrives), and each run checks out
# master when it starts (`ref: master` below), so it bumps past the release before it
# instead of recomputing a version npm already has.
concurrency:
  group: mcp-release
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Prod
    # dispatch: a maintainer on master. workflow_run: a successful Release workflow that a
    # maintainer dispatched on master (a workflow_run-triggered run always executes on the
    # default branch, so the release's own branch and event are what need checking).
    # github.triggering_actor is whoever started this attempt; github.actor and the event
    # payload keep the original actor on a re-run, so checking it too keeps re-runs of a
    # failed run to the allowlist.
    if: >-
      (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/master'
        && contains(fromJSON('["kroitor", "frosty00", "carlosmiei", "pcriadoperez"]'), github.actor)
        && contains(fromJSON('["kroitor", "frosty00", "carlosmiei", "pcriadoperez"]'), github.triggering_actor))
      || (github.event_name == 'workflow_run'
        && github.repository == 'ccxt/ccxt'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'workflow_dispatch'
        && github.event.workflow_run.head_branch == 'master'
        && contains(fromJSON('["kroitor", "frosty00", "carlosmiei", "pcriadoperez"]'), github.event.workflow_run.triggering_actor.login)
        && contains(fromJSON('["kroitor", "frosty00", "carlosmiei", "pcriadoperez"]'), github.triggering_actor))
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        working-directory: mcp
    steps:
      # master is protected, so the commit-back needs an actor allowed to push to it: the
      # same CCXT app token release.yml uses for its own version bump. A push authenticated
      # with the default GITHUB_TOKEN would also not trigger any downstream workflow.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      # master as it is when this run starts, not the commit the event pinned when the run was
      # created: a run that sat in the queue or waited for approval behind another release must
      # see that release's version bump, or smart-bump.sh recomputes a version npm already has
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - name: Install
        run: npm ci
      # Floor ccxt at the version the Release workflow committed to master, so the tarball, the
      # lockfile and the .mcpb bundle all carry it, and `npm test` below runs against it.
      - name: Raise the ccxt dependency floor to the released ccxt version
        run: |
          CCXT_VERSION=$(node -p "require('../package.json').version")
          CURRENT_FLOOR=$(node -p "require('./package.json').dependencies.ccxt.replace(/^[\^~]/, '')")
          # raise only, never lower
          if [ "$(printf '%s\n%s\n' "$CURRENT_FLOOR" "$CCXT_VERSION" | sort -V | tail -n1)" = "$CURRENT_FLOOR" ]; then
            echo "ccxt floor ^${CURRENT_FLOOR} already covers ${CCXT_VERSION}, leaving it"
            exit 0
          fi
          # npm has taken 8-11 minutes to serve a ccxt release (~70 MB) after its publish step
          # returned. An automatic run follows a successful release, so the version will appear:
          # wait up to 30 minutes, then fail. A dispatch waits 5 minutes, then keeps the current
          # floor: master can carry a release commit whose npm publish failed (4.5.86 never
          # reached npm), and that must not block an unrelated ccxt-mcp release.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then attempts=60; else attempts=10; fi
          served=""
          for attempt in $(seq 1 "$attempts"); do
            if [ "$(npm view "ccxt@${CCXT_VERSION}" version 2>/dev/null)" = "$CCXT_VERSION" ]; then
              served="yes"
              break
            fi
            echo "ccxt@${CCXT_VERSION} not on npm yet (${attempt}/${attempts})..."
            [ "$attempt" -lt "$attempts" ] && sleep 30
          done
          if [ -z "$served" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
              echo "::error::master is at ccxt ${CCXT_VERSION} but npm still does not serve it after 30 minutes — refusing to release ccxt-mcp against a ccxt that cannot be installed"
              exit 1
            fi
            echo "::warning::master is at ccxt ${CCXT_VERSION} but npm does not serve it — keeping the ccxt floor at ^${CURRENT_FLOOR}"
            exit 0
          fi
          # retry the install too, in case the metadata it reads lags the document npm view read
          for attempt in 1 2 3 4 5; do
            if npm install "ccxt@^${CCXT_VERSION}" --save --no-audit --no-fund --ignore-scripts; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::npm serves ccxt@${CCXT_VERSION} but npm install could not resolve it"
              exit 1
            fi
            sleep 30
          done
          echo "ccxt dependency: $(node -p "require('./package.json').dependencies.ccxt"), locked at $(node -p "require('./package-lock.json').packages['node_modules/ccxt'].version")"
      # bump before building so the compiled server + doc manifest carry the new version.
      # smart-bump.sh reads ./package.json relative to cwd, so it bumps the mcp package
      # (not the root ccxt one) thanks to the job-level working-directory.
      - name: Set new version
        id: bump
        run: |
          npm config set git-tag-version=false
          NEW_VERSION=$(../build/smart-bump.sh)
          npm version "$NEW_VERSION"
          node scripts/sync-versions.mjs
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build (tsc + doc manifest)
        run: npm run build
      - name: Test
        run: npm test
      - run: node -v && npm -v
      - name: Publish to npm (provenance)
        run: npm publish --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
      # commit the bump only after a successful publish, so a failed release leaves
      # master untouched and the next dispatch retries the same version number
      - name: Get App bot user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          id=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).id")
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: Commit the version bump to master
        id: commit
        working-directory: ${{ github.workspace }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          CCXT_RANGE=$(node -p "require('./mcp/package.json').dependencies.ccxt")
          # Master can move while the release builds, so every attempt re-applies the bump on
          # top of the newest master instead of rebasing a commit onto it. The bump edits
          # mcp/package.json dependencies and lockfile entries that dependency PRs also touch,
          # and a rebase conflict here, after npm already has the version, would leave master
          # behind npm and wedge every later release on a 403.
          bump_on_master () {
            git fetch origin master &&
              git reset --hard origin/master &&
              (cd mcp &&
                npm pkg set "version=${NEW_VERSION}" "dependencies.ccxt=${CCXT_RANGE}" &&
                npm install --package-lock-only --ignore-scripts --no-audit --no-fund &&
                node scripts/sync-versions.mjs) &&
              git add mcp/package.json mcp/package-lock.json mcp/mcpb/manifest.json mcp/server.json &&
              git commit -m "[Automated changes] ccxt-mcp ${NEW_VERSION}"
          }
          pushed=""
          for attempt in 1 2 3 4 5; do
            if bump_on_master && git push origin HEAD:master; then
              echo "pushed on attempt ${attempt}"
              pushed="yes"
              break
            fi
            echo "push or re-apply failed, retrying (${attempt})..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          if [ -z "$pushed" ]; then
            # ccxt-mcp@${NEW_VERSION} is already on npm (immutable) but master is still on the
            # version before it, so smart-bump.sh would recompute ${NEW_VERSION} on the next
            # dispatch and die at `npm publish` on a 403 — wedging releases until master catches up
            echo "::error::push failed after 5 attempts — ccxt-mcp@${NEW_VERSION} is published but master is not bumped; set mcp/package.json to ${NEW_VERSION} (and run npm run sync-versions) on master before the next dispatch, or every release will conflict on ${NEW_VERSION}"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Register the release with the MCP registry (io.github.ccxt/ccxt-mcp) so MCP hosts can
      # discover it. Runs last: the registry proves namespace ownership by reading `mcpName`
      # out of the *published* npm tarball, so npm must be live first, and keeping it after the
      # commit-back means a registry hiccup leaves npm and master consistent with each other.
      #
      # Auth is GitHub OIDC — `login github-oidc` exchanges the Actions token for a registry
      # JWT and derives the namespace from the `repository_owner` claim, which is `ccxt` here.
      # That is why this belongs in CI and not on a laptop: an interactive `login github` only
      # grants `io.github.<user>/*` unless the org has approved the registry's OAuth app, so a
      # maintainer publishing by hand gets a 403 on the org namespace.
      # Pinned + checksum-verified, not `latest`: this runs inside a job holding id-token:
      # write (npm trusted publishing) and the App token that checkout persisted into
      # .git/config — a contents:write credential for protected master. An unpinned binary
      # from a third-party release would execute with all of that in reach.
      - name: Install mcp-publisher
        working-directory: ${{ runner.temp }}
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" mcp-publisher
      # continue-on-error: the `bundle` job is `needs: publish`, so failing this step would
      # skip the .mcpb build entirely — leaving the published npm version with no matching
      # bundle and `ccxt-mcp-latest` (the one-click URL in the docs) pinned to the previous
      # release. A registry outage must not cost the desktop bundle; the ::error:: annotation
      # still marks the run, and the registry entry is then the only casualty.
      - name: Publish to the MCP registry (OIDC)
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/mcp-publisher" login github-oidc
          # npm's CDN can lag its own publish response, and the registry rejects a server whose
          # tarball it cannot read yet; a re-run costs a Prod approval and a burnt version, so
          # absorb that window here rather than failing the release over propagation
          for attempt in 1 2 3 4 5; do
            if "${RUNNER_TEMP}/mcp-publisher" publish; then
              echo "published to the registry on attempt ${attempt}"
              exit 0
            fi
            echo "registry publish failed, retrying (${attempt})..."
            [ "$attempt" -lt 5 ] && sleep 20
          done
          # Deliberately no recovery instruction here: Actions re-runs whole jobs, never single
          # steps, and re-running `publish` restarts at `Set new version`, recomputes the same
          # number and dies at `npm publish` on the immutable version. A manual publish hits the
          # org-namespace 403 this step exists to route around. The registry simply catches up
          # on the next release — it tracks the latest version, so nothing needs backfilling.
          echo "::error::registry publish failed after 5 attempts — ccxt-mcp@${{ steps.bump.outputs.version }} is on npm and master is bumped; the registry entry will catch up on the next release, no manual action required"
          exit 1

  # Build the Claude Desktop .mcpb bundle and attach it to a GitHub Release so users can
  # one-click install (Settings -> Extensions) or curl a stable URL. Runs after the npm
  # publish so the two stay in lockstep. Bundle is unsigned (Desktop shows an "unverified"
  # prompt); add `mcpb sign` with an Anthropic signing cert here once one is configured.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    # No `environment`: this job uses only github.token, and it runs only after `publish`
    # succeeded, so publish's Prod approval covers the whole release (one approval, not two).
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mcp
    steps:
      # NB: check out the exact commit the publish job pushed, not the dispatched SHA (which
      # still carries the pre-bump version, silently bundling a .mcpb one version behind npm)
      # and not the `master` tip (which another merge can move between the two jobs)
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false  # never use caching in release builds
      - name: Verify the checkout carries the version that was just published
        env:
          NEW_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          CHECKED_OUT="$(node -p "require('./package.json').version")"
          if [ "$CHECKED_OUT" != "$NEW_VERSION" ]; then
            echo "::error::master is at ${CHECKED_OUT} but ${NEW_VERSION} was published — refusing to bundle a mismatched version"
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Build the .mcpb desktop bundle
        run: npm run mcpb
      - name: Attach the .mcpb to a versioned + a moving "latest" GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="ccxt-mcp-v$VERSION"
          NOTES="Download **ccxt-mcp.mcpb** below and open it in Claude Desktop (Settings > Extensions) for a one-click install. Any other MCP host (Claude Code, Cursor, VS Code, Windsurf): \`claude mcp add ccxt -- npx -y ccxt-mcp\`. Docs: https://docs.ccxt.com/docs/mcp"
          # versioned archival release (kept out of the repo-wide "latest" pointer) — immutable:
          # a re-run must NOT overwrite an already-published version, it must fail loudly
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — archived .mcpb artifacts are immutable"
            exit 1
          else
            gh release create "$TAG" ccxt-mcp.mcpb --title "ccxt-mcp v$VERSION" --notes "$NOTES" --latest=false
          fi
          # moving release -> stable URL: /releases/download/ccxt-mcp-latest/ccxt-mcp.mcpb
          if gh release view ccxt-mcp-latest >/dev/null 2>&1; then
            gh release upload ccxt-mcp-latest ccxt-mcp.mcpb --clobber
            gh release edit ccxt-mcp-latest --title "CCXT MCP - latest (v$VERSION)" --notes "$NOTES"
          else
            gh release create ccxt-mcp-latest ccxt-mcp.mcpb --title "CCXT MCP - latest (v$VERSION)" --notes "$NOTES" --latest=false
          fi
