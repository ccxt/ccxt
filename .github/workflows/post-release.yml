name: On release published (pushback changelog)

on:
  workflow_run:
    workflows: ["Release workflow"]
    types:
      - completed
  # manual run from the Actions tab, e.g. when the release was published but this workflow was skipped or failed
  workflow_dispatch:
    inputs:
      announce:
        description: 'Post the release announcement to Telegram and Discord'
        type: boolean
        default: true
jobs:
  changelog:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Update changelog
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          clean: false
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 2
          # Only CHANGELOG.md (root files are always in a cone checkout) and the
          # announcement script are used. The changelog pushback stays in-cone.
          sparse-checkout: build/utils
      - name: Generate and push changelog
        uses: rhysd/changelog-from-release/action@v3
        with:
          file: CHANGELOG.md
          github_token: ${{ steps.app-token.outputs.token }}
          # CHANGELOG.md is the ccxt library's changelog. This tool renders *every* GitHub
          # release in the repo, so non-library releases were being interleaved with the ccxt
          # versions as if they were library releases: the sub-package releases cut by
          # mcp-release.yml (ccxt-mcp-vX.Y.Z and the moving ccxt-mcp-latest), and 8 historical
          # go/vX.Y.Z Go-module releases. -i takes a regex of tags to skip.
          #
          # A denylist, not `-e` (allowlist): ccxt's own tag convention is not uniform — 137
          # releases predate the `v` prefix (4.0.3, 4.3.22 …), 76 of which render in
          # CHANGELOG.md today, and an allowlist anchored on `^v` would delete them all on the
          # next regeneration, since the file is rebuilt from scratch each run.
          #
          # -d=false drops draft releases. changelog-from-release includes them by default and
          # renders releases in GitHub API order, which returns drafts first. cleanup-old-tags
          # prunes old version tags on every release, and GitHub demotes a release whose tag
          # disappeared to a draft - that is how the 2023 4.0.3 release (tag pruned, release
          # kept) ended up as the first section of CHANGELOG.md and got announced as the
          # latest version. Drafts are not published releases and do not belong in the file.
          args: -d=false -i ^(ccxt-mcp-|go/)
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Post release announcement to Telegram and Discord
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.announce }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # package.json on master carries the version the release workflow just published, so
          # the announcement names that release instead of whatever section happens to be first.
          VERSION=$(node -p "require('./package.json').version")
          echo "Announcing CCXT $VERSION"
          node --experimental-strip-types build/utils/release-announcement.ts --changelog CHANGELOG.md --version "$VERSION"
  failed-release:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip changelog update
        run: echo "Won't continue because the Release workflow failed."