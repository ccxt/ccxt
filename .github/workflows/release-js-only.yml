name: Release JS workflow

on:
  workflow_dispatch:
    inputs:
      example_input:
        description: 'An example input value'
        required: false
        default: 'default-value'

permissions:
  id-token: write
  contents: write

jobs:
  manual-job:
    runs-on: ubuntu-latest
    environment: Prod
    if: github.ref == 'refs/heads/master' && contains(fromJSON('["kroitor", "frosty00", "carlosmiei"]'), github.actor)

    steps:
      - name: Print Trigger Info
        run: |
          echo "This workflow was triggered manually."
          echo "Input value: ${{ github.event.inputs.example_input }}"
      - name: Generate App token
        if: github.ref == 'refs/heads/master'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          token: ${{ github.ref == 'refs/heads/master' && steps.app-token.outputs.token || github.token }}
          fetch-depth: 2
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - name: Install NPM dependencies
        run: npm ci
      - name: Pre-transpile
        run: npm run  pre-transpile-js
      - name: Transpile TS
        run: npm run tsBuild
      - run: node -v && npm -v
      - run: npm publish --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
