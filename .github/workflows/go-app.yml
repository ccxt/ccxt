name: Go
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} · {1}', github.ref_name, github.sha) }}
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[Automated changes]') }}

jobs:
  build:
    runs-on: [ self-hosted, linux, x64, go ]
    if: ${{ !startsWith(github.event.head_commit.message, 'Update changelog for') && !startsWith(github.event.head_commit.message, '[Automated changes]') && !contains(github.event.head_commit.message, 'Merge branch ''master'' of https://github.com/ccxt/ccxt') }}
    timeout-minutes: 30
    steps:
      - name: Generate App token
        if: github.ref == 'refs/heads/master'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          clean: false
          token: ${{ github.ref == 'refs/heads/master' && steps.app-token.outputs.token || github.token }}
      - name: Install dependencies
        run: go mod download
        working-directory: ./go
      - name: Setup Node.js
        uses: actions/setup-node@v5
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Determine modified files
        run: ./build/utils/init_actions.sh
      - name: Check tsc version
        run: tsc --version
      - name: Install tsx
        run: npm install -g tsx
      - name: Pre Transpile GO
        run: npm run pre-transpile-go
      - name: Transpile To Go
        if: env.important_modified == 'true'
        run: tsx build/goTranspiler.ts --rest-and-ws --force
      - name: Transpile to Go (specific)
        if: env.important_modified == 'false'
        # run: |
        #   cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
        #   # for exchange in $cleaned_rest_files; do
        #   #   tsx build/goTranspiler.ts -- $exchange
        #   # done
        run : |
          # cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          # cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
          # # echo "Cleaned files: $cleaned_rest_files"
          # # tsx build/granular-go-build.ts $cleaned_rest_files
          # if [ -n "$cleaned_rest_files" ]; then
          #   echo "Cleaned files: $cleaned_rest_files"
          #   tsx build/granular-go-build.ts $cleaned_rest_files
          # else
          #   echo "No rest files to process; skipping."
          # fi
          # cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
          # if [ -n "$cleaned_ws_files" ]; then
          #   echo "Cleaned files: $cleaned_ws_files"
          #   tsx build/granular-go-build.ts $cleaned_ws_files
          # else
          #   echo "No websocket files to process; skipping."
          # fi
          read -r -a files <<<"$(printf '%s %s' "${{ env.rest_files }}" "${{ env.ws_files }}" | xargs)"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files to process; skipping."
            exit 0
          fi
          echo "Files to process: ${files[*]}"
          tsx build/granular-go-build.ts "${files[@]}"
      # - name: Install dependencies
      #   run: cd go && go get ./ccxt && cd ..
      - name: Transpile prediction to Go
        if: env.prediction_modified == 'true'
        run: npm run transpile-prediction-go
      - name: Build
        run: go build -C go ./v4
      - name: Build Ws
        run: go build -C go ./v4/pro
      - name: Build prediction
        if: env.prediction_modified == 'true'
        run: go build -C go ./v4/prediction
      - name: Build tests
        run: go -C go build ./tests/main.go
      - name: Test GO Types
        if: env.important_modified == 'true'
        run: npm run test-types-go
      - name: Run Base Tests
        if: env.important_modified == 'true'
        run: npm run test-base-rest-go
      - name: Run Base Ws Tests
        if: env.important_modified == 'true'
        run: npm run test-base-ws-go
      - name: Run Id Tests
        if: env.important_modified == 'true'
        run: npm run id-tests-go
      - name: Request tests
        if: env.important_modified == 'true'
        run: npm run request-go
      - name: Request tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run request-go -- $exchange
          done
      - name: Response Tests
        if: env.important_modified == 'true'
        run: npm run response-go
      - name: Response tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run response-go -- $exchange
          done
      - name: Prediction request tests
        if: env.prediction_modified == 'true'
        run: npm run request-go-prediction
      - name: Prediction response tests
        if: env.prediction_modified == 'true'
        run: npm run response-go-prediction

      # - name: Upload Go Files
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: go-files
      #     path: go/
      - name: Upload Go Files
        uses: actions/upload-artifact@v4
        with:
          name: go-files
          path: |
            go/
            !go/main
          retention-days: 1
      - name: Upload shared_env.txt
        uses: actions/upload-artifact@v4
        with:
            name: shared_env
            path: shared_env.txt

      - name: Get App bot user ID
        if: github.ref == 'refs/heads/master'
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          id=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).id")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Push GO changes to master
        if: github.ref == 'refs/heads/master' && github.actor != 'ccxt-release[bot]'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout HEAD README.md wiki  # only JS does wiki pushback

          rm -f ./go/tests/main
          rm -f ./go/v4/ccxt
          rm -f ./go/main

          git add go/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[Automated changes] GO files"

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase --autostash origin/master
            if git push origin HEAD:master; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "master moved, retrying (${attempt})..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "push failed after 5 attempts"
          exit 1

  live-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Download shared_env
        uses: actions/download-artifact@v4
        with:
          name: shared_env
      - name: Download Go Binary
        uses: actions/download-artifact@v4
        with:
          name: go-files
          path: go/
      # Cache Go toolchain + module/build caches (ubuntu-latest is ephemeral).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/v4/go.mod
          cache-dependency-path: go/v4/go.sum
      - name: Restore shared_env
        run: ./build/utils/restore_shared_env.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Export exchanges
        run: npm run export-exchanges
      - name: Build
        run: go build -C go ./v4
      - name: Build tests
        run: go build -C go ./tests/main.go
      - name: Live tests
        if: env.important_modified == 'true'
        run: ./run-tests-simul.sh --go
      - name: Live tests (specific)
        if: env.important_modified == 'false'
        run: ./run-tests-simul.sh --go "${{ env.rest_files }}" "${{ env.ws_files }}"
