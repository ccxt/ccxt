name: Order Router

# Scoped to the order-router service only. It is a standalone Node/TypeScript app that depends on
# the published ccxt package — it is not part of the transpile pipeline, so it deliberately does
# not run on changes elsewhere in the repo, and nothing here touches ts/src or generated output.
#
# The two ts/src paths are the ONE exception, and they are here on purpose. The six-language
# `OrderRouter` clients (ts/src/base/OrderRouter.ts and its five hand-written ports) talk to THIS
# service, and their shared fixture ts/src/test/base/fixtures/orderRouter.json is a hand-written
# snapshot of what the service returns — nothing regenerated it and nothing checked it. The
# language workflows all `paths-ignore: order-router/**` and this one only fired on
# `order-router/**`, so the two halves of the contract were path-exclusive by construction: a
# service-side field rename and a fixture edit could each go green while the pair disagreed. The
# `fixture-contract` job below is the cheap half of closing that — it runs on both path sets and
# asserts the fixture against the service's own OpenAPI schema.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'order-router/**'
      - '.github/workflows/order-router.yml'
      - 'ts/src/base/OrderRouter.ts'
      - 'ts/src/test/base/fixtures/orderRouter.json'
  pull_request:
    paths:
      - 'order-router/**'
      - '.github/workflows/order-router.yml'
      - 'ts/src/base/OrderRouter.ts'
      - 'ts/src/test/base/fixtures/orderRouter.json'

permissions:
  contents: read

# NOTE: the deploy concurrency group is declared on the `deploy` and `rollback` JOBS, not here.
# A workflow-level group would put every PR's build-and-test into the same queue as a 45-minute
# production deploy — and GitHub cancels a PENDING run when a newer one queues into an occupied
# group, so a PR could show a cancelled required check it never got to run. build-and-test touches
# no secrets and no box; only the two jobs that ssh to the VM need serialising.

defaults:
  run:
    working-directory: order-router

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Every other job in this file bounds itself; this one did not, so a hung step (a Postgres
    # service that never becomes healthy, a test that waits on a socket) held a runner for the
    # six-hour default.
    timeout-minutes: 20
    # The key-lifecycle smoke test needs a database: Postgres is the source of truth for
    # api_keys, and the router reads only the projected snapshot. Asserting that a minted key
    # authenticates and a revoked one stops is therefore an assertion about the projection, and
    # there is no way to exercise it without the source it projects from.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orderrouter
          POSTGRES_PASSWORD: orderrouter
          POSTGRES_DB: orderrouter
        ports:
          - 5432:5432
        # `-U orderrouter -d orderrouter` is load-bearing, do not "simplify" it back to a bare
        # `pg_isready`. The health command runs as root INSIDE the postgres container, and
        # pg_isready with no user defaults to the OS user — role `root`, which does not exist here
        # because POSTGRES_USER is `orderrouter`. postgres:18 rejects that connection, so the probe
        # can never pass: the server logged "ready to accept connections" nine seconds before the
        # first retry, then all five retries logged `FATAL: role "root" does not exist`, the
        # container was declared unhealthy and the whole job died at "Initialize containers" before
        # a single step ran. Deterministic, not a race. Quoted so the folded block keeps the two
        # flags attached to --health-cmd instead of handing them to the health command's shell.
        options: >-
          --health-cmd "pg_isready -U orderrouter -d orderrouter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: order-router/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Check the ccxt pin against the repository it lives in
        # The service depends on the PUBLISHED ccxt at an exact version, and nothing reconciled that
        # pin with the repo around it: it sat thirteen patch releases behind, so fixes landed in
        # ts/src never reached the deployed router and no job could see it. This does not bump the
        # pin (that is a behaviour change with its own review) — it fails when the lag grows past
        # the one written down in order-router/package.json, so drift is never invisible again.
        run: npm run check:ccxt-pin

      - name: Unit tests
        # Offline by design: no live exchange connections, no network. Anything needing a real
        # exchange lives in benchmark/ and is run manually (see order-router/README.md).
        run: npm test

      - name: Verify the service boots and serves authenticated requests
        # Smoke test that catches wiring regressions unit tests can't: real process, real HTTP
        # listener, real auth middleware. Uses a single exchange to keep it quick, and tolerates
        # exchange unreachability from the runner (asserted endpoints do not require live data).
        env:
          ORDER_ROUTER_API_KEY: ci-smoke-key
          ORDER_ROUTER_EXCHANGES: kraken
          ORDER_ROUTER_SYMBOLS: BTC/USDT
          # Must be set for the ROUTER process, not just the CLI: a path exported later in the
          # script would leave the two reading different files and the key-lifecycle block below
          # would assert against a store the server never loaded.
          ORDER_ROUTER_KEYS_FILE: /tmp/ci-keys.json
          # Read by the admin CLI only. The ROUTER never receives it, deliberately: it reads the
          # projected snapshot and nothing else, so a database outage cannot take authentication
          # down with it. Handing it the connection string here would quietly test a topology
          # production does not run.
          DATABASE_URL: postgres://orderrouter:orderrouter@localhost:5432/orderrouter
          LOG_LEVEL: warn
        run: |
          node dist/index.js > /tmp/router.log 2>&1 &
          ROUTER_PID=$!
          trap 'kill $ROUTER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then break; fi
            if ! kill -0 $ROUTER_PID 2>/dev/null; then
              echo "::error::router process exited during startup"; cat /tmp/router.log; exit 1
            fi
            sleep 1
          done

          echo "--- /health must be reachable without credentials (probe path) ---"
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'

          echo "--- protected route must reject an unauthenticated request with 401 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/symbols)
          if [ "$code" != "401" ]; then echo "::error::expected 401, got $code"; exit 1; fi

          echo "--- protected route must accept a valid key ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' http://localhost:8080/symbols)
          if [ "$code" != "200" ]; then echo "::error::expected 200, got $code"; cat /tmp/router.log; exit 1; fi

          echo "--- a wrong key must still be rejected ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: wrong-key' http://localhost:8080/symbols)
          if [ "$code" != "401" ]; then echo "::error::expected 401, got $code"; exit 1; fi

          # The endpoint the whole service exists for. Booting cleanly and answering /symbols says
          # nothing about whether routing still works, so exercise it against a real cached book —
          # but do NOT make a third party's uptime a deploy gate.
          #
          # This assertion used to hard-fail when no book arrived within 60s. The only source of a
          # book here is a live websocket to Kraken from a GitHub runner, so a Kraken outage, a
          # venue-side block on runner IPs or an egress hiccup failed `build-and-test`, and
          # `deploy` needs it — meaning a third-party exchange being down blocked every deploy,
          # including the fix for an in-progress incident. The step's own comment above ("tolerates
          # exchange unreachability from the runner") had stopped being true.
          #
          # What replaces it is a conditional assertion, which is the honest one: routing is only
          # testable here if a book actually arrived, so ASK first. /orderbook/kraken/BTC/USDT is
          # 404 until one has. If a book IS cached and /route still cannot produce legs from it,
          # that is a routing regression and it fails hard, exactly as before. If no book ever
          # arrived, the venue — not this commit — is the reason, and the step says so loudly and
          # moves on. The offline suite covers the same path deterministically against a seeded
          # cache (src/api/server.test.ts: "GET /route derives pair and direction from the asset
          # pair" and its neighbours), and it runs in the `npm test` step above, so /route is never
          # unasserted — only its live-venue variant is best-effort.
          echo "--- /route must answer with a route once a book has arrived ---"
          for i in $(seq 1 30); do
            body=$(curl -s -H 'x-api-key: ci-smoke-key' \
              'http://localhost:8080/route?from=USDT&to=BTC&amountOut=0.001&strategy=split_optimal')
            if echo "$body" | grep -q '"legs":\[{'; then break; fi
            sleep 2
          done
          book_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' \
            'http://localhost:8080/orderbook/kraken/BTC%2FUSDT')
          if echo "$body" | grep -q '"legs":\[{'; then
            echo "$body" | grep -q '"pair":"BTC/USDT"' \
              || { echo "::error::/route did not return a BTC/USDT hop"; echo "$body"; cat /tmp/router.log; exit 1; }
            echo "$body" | grep -q '"impactBps"' \
              || { echo "::error::/route response is missing impactBps"; echo "$body"; exit 1; }
            echo "$body" | grep -q '"requestId"' \
              || { echo "::error::/route response is missing requestId"; echo "$body"; exit 1; }
            echo "/route answered from a live Kraken book"
          elif [ "$book_code" = "200" ]; then
            echo "::error::a BTC/USDT book IS cached for kraken and /route still returned no legs"
            echo "$body"; cat /tmp/router.log; exit 1
          else
            echo "::warning::no live Kraken book reached this runner (/orderbook was ${book_code}),"
            echo "::warning::so the live-venue /route check was skipped. This is NOT an assertion"
            echo "::warning::about the commit: /route is covered offline in src/api/server.test.ts."
          fi

          # These need no market data, so they assert the contract deterministically.
          echo "--- /route request-shape errors must be distinguishable ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' \
            'http://localhost:8080/route?from=USDT&to=BTC')
          if [ "$code" != "400" ]; then echo "::error::missing amount should be 400, got $code"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' \
            'http://localhost:8080/route?from=USDT&to=BTC&amountIn=1&amountOut=1')
          if [ "$code" != "400" ]; then echo "::error::both amounts should be 400, got $code"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' \
            'http://localhost:8080/route?from=NOTACOIN&to=ALSONOTACOIN&amountIn=1')
          if [ "$code" != "404" ]; then echo "::error::unreachable pair should be 404, got $code"; exit 1; fi

          # The multi-key path, end to end: mint a key with the CLI, use it, revoke it, reload,
          # and confirm it stops working. The three assertions above still pass through the legacy
          # env bridge, so both schemes are covered simultaneously — which is exactly the property
          # the migration depends on.
          echo "--- a database-minted key works, and revoking it takes effect on reload ---"
          # The keys CLI was deleted when Postgres became the source of truth for api_keys; with
          # the database holding the rows, a second writer is a lost-update problem nobody needs.
          # This block is the same assertion against the replacement path: mint in Postgres,
          # project to the snapshot, and check the router honours it.
          node dist/db/migrate.js
          node dist/cli/admin.js create-admin --email ci@example.invalid --password ci-smoke-password
          node dist/cli/admin.js create-key --email ci@example.invalid --name ci-key > /tmp/ci-key-create.txt
          NEWKEY=$(grep -o 'or_live_[A-Za-z0-9_-]*' /tmp/ci-key-create.txt)
          if [ -z "$NEWKEY" ]; then echo "::error::create-key printed no key"; cat /tmp/ci-key-create.txt; exit 1; fi

          # The router was started before the file existed, so this also exercises reload-from-absent.
          kill -HUP $ROUTER_PID; sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $NEWKEY" http://localhost:8080/symbols)
          if [ "$code" != "200" ]; then echo "::error::a new key should be 200, got $code"; cat /tmp/router.log; exit 1; fi

          # Revocation is a database write plus a re-projection — there is no CLI verb for it,
          # because the dashboard owns that action.
          PGPASSWORD=orderrouter psql -h localhost -U orderrouter -d orderrouter \
            -c "UPDATE api_keys SET revoked_at = now() WHERE name = 'ci-key'"
          node dist/cli/admin.js project
          kill -HUP $ROUTER_PID; sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $NEWKEY" http://localhost:8080/symbols)
          if [ "$code" != "401" ]; then echo "::error::a revoked key should be 401, got $code"; exit 1; fi

          # The legacy env key must still work throughout, or the migration would need a flag day.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' http://localhost:8080/symbols)
          if [ "$code" != "200" ]; then echo "::error::the legacy env key stopped working, got $code"; exit 1; fi

          echo "--- the key file must never contain a usable credential ---"
          if grep -q 'or_live_' /tmp/ci-keys.json; then
            echo "::error::plaintext key found in the key file"; exit 1
          fi

          echo "smoke test passed"

      - name: Verify the MCP server boots and enforces auth
        env:
          ORDER_ROUTER_API_KEY: ci-smoke-key
          ORDER_ROUTER_MCP_PORT: 8081
          LOG_LEVEL: warn
        run: |
          node dist/mcp/server.js > /tmp/mcp.log 2>&1 &
          MCP_PID=$!
          trap 'kill $MCP_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then break; fi
            if ! kill -0 $MCP_PID 2>/dev/null; then
              echo "::error::MCP process exited during startup"; cat /tmp/mcp.log; exit 1
            fi
            sleep 1
          done

          echo "--- /mcp must reject an unauthenticated JSON-RPC call ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          if [ "$code" != "401" ]; then echo "::error::expected 401, got $code"; cat /tmp/mcp.log; exit 1; fi

          echo "MCP smoke test passed"

  # ---------------------------------------------------------------------------------------------
  # The one job that sees BOTH halves of the OrderRouter contract.
  #
  # `ts/src/test/base/fixtures/orderRouter.json` is the shared fixture for the six hand-written
  # `OrderRouter` client ports. It is a hand-written snapshot of what THIS service returns, and
  # until now nothing regenerated it and nothing checked it: the language workflows skip
  # `order-router/**` and this workflow skipped `ts/src/**`, so the client expectations and the
  # service contract were never in the same run. A field renamed in the service and a fixture that
  # kept the old name both went green.
  #
  # Deliberately NOT a live end-to-end contract job. Booting the service and diffing a real /route
  # response against the fixture would reintroduce exactly the dependency on a live venue that
  # item 42 above removes from `build-and-test`. This asserts the fixture against the service's own
  # published schema instead — `order-router/openapi/openapi.yaml`, which is what the clients are
  # written against — so it is offline, deterministic and finishes in seconds. It checks shape, not
  # values: an extra field in the fixture is a client expecting something the service never
  # promises, and a missing required one is a client that would break on a response the service is
  # entitled to send.
  # ---------------------------------------------------------------------------------------------
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The shared client fixture matches the service's OpenAPI route schema
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PYEOF'
          import json, os, sys, yaml

          root = os.environ['GITHUB_WORKSPACE']
          schemas = yaml.safe_load(
              open(os.path.join(root, 'order-router/openapi/openapi.yaml'), encoding='utf-8')
          )['components']['schemas']
          fixture = json.load(
              open(os.path.join(root, 'ts/src/test/base/fixtures/orderRouter.json'), encoding='utf-8')
          )

          routes = fixture.get('routes') or {}
          # A fixture emptied of routes would satisfy every check below vacuously.
          if len(routes) < 4:
              print('::error::the fixture carries %d routes; it is supposed to be the shared '
                    'cross-language corpus' % len(routes))
              sys.exit(1)

          def props (name):
              return set(schemas[name].get('properties') or {})

          def required (name):
              return set(schemas[name].get('required') or [])

          problems = []

          def check (where, obj, schema):
              extra = sorted(set(obj) - props(schema))
              missing = sorted(required(schema) - set(obj))
              for field in extra:
                  problems.append('%s: fixture field "%s" is not in the %s schema — either the '
                                  'service dropped/renamed it or the fixture invented it'
                                  % (where, field, schema))
              for field in missing:
                  problems.append('%s: the %s schema requires "%s" and the fixture does not carry '
                                  'it — the clients are not asserting a field the service always '
                                  'sends' % (where, schema, field))

          for name, route in routes.items():
              check('routes.%s' % name, route, 'RouteResult')
              for i, hop in enumerate(route.get('hops') or []):
                  check('routes.%s.hops[%d]' % (name, i), hop, 'RouteHop')
                  for j, leg in enumerate(hop.get('legs') or []):
                      check('routes.%s.hops[%d].legs[%d]' % (name, i, j), leg, 'RouteLeg')

          if problems:
              for problem in problems:
                  print('::error::%s' % problem)
              print('')
              print('The six OrderRouter client ports assert against this fixture. Reconcile it '
                    'with order-router/openapi/openapi.yaml, then run `npm run test-order-router`.')
              sys.exit(1)

          print('%d fixture routes agree with RouteResult/RouteHop/RouteLeg' % len(routes))
          PYEOF

  # ---------------------------------------------------------------------------------------------
  # Ships the built tree to the VM behind docs.ccxt.com and restarts the systemd unit.
  #
  # `needs: build-and-test` is load-bearing: nothing reaches the box that has not type-checked,
  # passed the offline suite and booted under the CI smoke test first.
  #
  # Transfer is tar-over-ssh rather than the Docker/GHCR flow the other two deploy workflows use.
  # The router is a systemd service, not a container, and order-router/Dockerfile does not currently
  # build (copy-assets reads openapi/openapi.yaml, which the image never COPYs). rsync is not
  # installed on the box either, so tar over an ssh pipe is what is actually available — it needs
  # nothing on the far end but ssh and tar, and it lands the tree in one stream.
  # ---------------------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------------------
  # Who owns the deploy, and what happens in a repository that does not.
  #
  # `deploy`, `live-integration` and `rollback` are gated on `github.repository`, and that gate
  # STAYS: a fork must never hold a deploy key for someone else's box (see closed item 9). But the
  # gate had the failure mode of every silent conditional — merged into a repository that is not
  # the owner, the three jobs simply never run, GitHub reports the workflow green, and nothing
  # anywhere says that no deploy happened or who to ask. Someone reads a green tick on master and
  # believes the router is running their commit.
  #
  # This job is the gate, made loud. It is the single place the owning repository is named (the
  # three jobs below consume its output instead of repeating the string), it runs on exactly the
  # events that would otherwise deploy, and when it is not the owner it says so in the job log AND
  # in the run summary, names the owner, and points at the manual procedure. It exits 0 either way:
  # "this repository does not deploy the router" is a correct state, not a broken build — the bug
  # was that it was an invisible one.
  # ---------------------------------------------------------------------------------------------
  deploy-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The repository that holds ORDER_ROUTER_DEPLOY_* and reaches the box. Change this in ONE
      # place to move the deploy; do not re-add the literal to the jobs below.
      DEPLOY_REPOSITORY: pcriadoperez/ccxt
      # A person, not a team alias, because there is no team. Whoever changes this owns the box.
      DEPLOY_OWNER: '@pcriadoperez'
    outputs:
      # 'true' only in the owning repository. Consumed by deploy, live-integration and rollback.
      should-deploy: ${{ steps.gate.outputs.should-deploy }}
    steps:
      - name: Decide whether this repository deploys the router
        id: gate
        # No checkout in this job — it reads nothing from the tree. That makes the workflow-level
        # `defaults.run.working-directory: order-router` fatal (bash cannot start in a directory
        # that does not exist), so point this step at the workspace root instead. See the same
        # trap, solved the other way, in the `rollback` job below.
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${GITHUB_REPOSITORY}" = "${DEPLOY_REPOSITORY}" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REPOSITORY} is the deploy owner; the deploy jobs will run."
            exit 0
          fi
          echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=order-router was NOT deployed::This run built and tested the"
          echo "::warning::service but deployed nothing. ${GITHUB_REPOSITORY} is not the deploy"
          echo "::warning::owner (${DEPLOY_REPOSITORY} is), so it holds no deploy credentials and"
          echo "::warning::cannot reach the box. A green run here does NOT mean the deployed"
          echo "::warning::router is running this commit. Owner: ${DEPLOY_OWNER}. Manual"
          echo "::warning::procedure: order-router/README.md, 'Deploying by hand'."
          {
            echo "## order-router: no deploy from this repository"
            echo
            echo "This run **built and tested** the service and **deployed nothing**."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| This repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| Deploy owner repository | \`${DEPLOY_REPOSITORY}\` |"
            echo "| Deploy owner | ${DEPLOY_OWNER} |"
            echo
            echo "The deploy jobs are gated on the owning repository on purpose: a fork must not"
            echo "hold a deploy key for a box it does not own. Nothing here is broken — but a"
            echo "green run on this repository says nothing about what the deployed router is"
            echo "running."
            echo
            echo "To ship this commit: ask ${DEPLOY_OWNER} to run **Order Router →"
            echo "\`workflow_dispatch\`** on \`${DEPLOY_REPOSITORY}\`, or follow the manual"
            echo "procedure in \`order-router/README.md\` (\"Deploying by hand\")."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [ build-and-test, deploy-gate ]
    # Deploys must never overlap or be cancelled midway: the swap is a symlink move followed by a
    # systemd restart, and a run killed between the two leaves the box pointing at a release nothing
    # is serving. Queue instead. Scoped to this job (and `rollback`, which mutates the same symlink)
    # so that PR CI is not serialised behind a production deploy.
    concurrency:
      group: order-router-deploy
      cancel-in-progress: false
    # THE guard. This workflow triggers on `pull_request`, so without this every PR — including one
    # from a fork — would reach a job holding the deploy key. GitHub already withholds secrets from
    # fork PRs, but that is a property of the platform, not of this file; this is the explicit belt.
    # The repository check itself lives in `deploy-gate`, which is also where its ABSENCE is
    # announced — a repository that is not the owner used to skip this job in total silence.
    if: needs.deploy-gate.outputs.should-deploy == 'true'
    runs-on: ubuntu-24.04-arm        # arm64 — same box as docs.ccxt.com, so node_modules ships as-is
    timeout-minutes: 30
    # Optional hardening: create an environment named `order-router-prod` with a required reviewer
    # and uncomment the next line to gate every production deploy on human approval.
    # environment: order-router-prod
    env:
      BASE: /opt/order-router
      # Where the unit listens on loopback. The public URL is nginx's business, not the deploy's —
      # this smoke test deliberately talks to the process directly so a passing nginx config cannot
      # mask a dead upstream (and a broken nginx cannot fail an otherwise good deploy).
      PORT: '8080'
      SERVICE: order-router
      # Companion units that run out of the SAME `current` symlink, space separated, skipped when
      # not installed. They must be listed here or the deploy is only half a deploy: the symlink
      # swap changes what `current` points at but does not change what an already-running process
      # has open, so an unrestarted companion keeps executing the OLD release — and the retention
      # prune below deletes that tree after five more deploys, at which point the next lazy
      # `require` in it fails on a directory that no longer exists. Only the router's restart costs
      # anything (it rebuilds the whole book cache); these two are cheap.
      #   order-router-web    -> dist/web/index.js      (the console at /router)
      #   order-router-ingest -> dist/db/ingestRunner.js (audit ingest + key projection)
      EXTRA_SERVICES: 'order-router-web order-router-ingest'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: order-router/package-lock.json

      - name: Build the release
        # GITHUB_SHA is what scripts/write-build-info.mjs bakes into dist/build-info.json, and that
        # file is the only thing that lets the deployed process answer "which commit am I?" — which
        # is what both smoke tests below assert against.
        run: |
          npm ci
          npm run build
          grep -q "\"commit\": \"${GITHUB_SHA}\"" dist/build-info.json \
            || { echo "::error::dist/build-info.json does not carry ${GITHUB_SHA}"; cat dist/build-info.json; exit 1; }

      - name: Unit tests on the tree that ships
        # build-and-test runs on x64; this job rebuilds from scratch on arm64 and it is THIS tree,
        # not the tested one, that is packed and unpacked onto the box. Nothing had ever run a
        # single assertion against it, so an arm64-only failure — a native dependency, a differing
        # engine build — reached production and was first observed by the on-box smoke test, after
        # the symlink had already moved. Same suite, ~18s, before anything is packed.
        run: npm test

      - name: Prune to production dependencies
        # The box gets a ready-to-run tree: no npm install there, no network needed at deploy time,
        # and no build toolchain on a 7.5 GB host shared with the docs and playground containers.
        # Safe to ship node_modules because this runner is arm64, exactly like the box.
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Pack the release
        # scripts/ rides along so live-integration.mjs can be run by hand from the box itself.
        run: tar czf /tmp/order-router.tgz dist node_modules scripts package.json package-lock.json

      - name: Configure SSH (pinned host key)
        # Pinned, never ssh-keyscan'd at deploy time: keyscan-on-connect trusts whatever answers,
        # which is precisely the attack host-key checking exists to stop.
        env:
          SSH_KEY: ${{ secrets.ORDER_ROUTER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORDER_ROUTER_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload the release (tar over ssh — the box has no rsync)
        # Unpacked into a per-run staging directory and swapped into place, NEVER unpacked over the
        # release directory itself. Re-deploying a SHA that is already live (a re-run, a
        # workflow_dispatch, a push that did not change the tree) used to `rm -rf` the very tree the
        # running systemd unit executes from BEFORE anything replaced it — and this step runs before
        # the activate step, so none of that step's rollback logic covers a failure here. A dropped
        # connection or a full disk left `current` pointing at an empty directory with no automated
        # recovery. Two renames inside one directory are atomic and cannot half-happen.
        env:
          HOST: ${{ secrets.ORDER_ROUTER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ORDER_ROUTER_DEPLOY_USER }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${HOST}" \
            "set -e; rm -rf ${BASE}/releases/.incoming-${RUN_ID}; mkdir -p ${BASE}/releases/.incoming-${RUN_ID}"
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${HOST}" \
            "tar xzf - -C ${BASE}/releases/.incoming-${RUN_ID}" < /tmp/order-router.tgz
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${HOST}" \
            BASE="${BASE}" SHA="${SHA}" RUN_ID="${RUN_ID}" 'bash -se' <<'EOF'
          set -e
          REL="$BASE/releases/$SHA"
          STAGE="$BASE/releases/.incoming-$RUN_ID"
          [ -d "$STAGE" ] || { echo "::error::$STAGE was never unpacked"; exit 1; }
          if [ -e "$REL" ]; then
            # A redeploy of the same SHA. Move the old tree aside rather than deleting it: the
            # running process may still lazily require a module out of it before the restart, and
            # the retention prune in the activate step clears it later.
            rm -rf "$REL.superseded"
            mv "$REL" "$REL.superseded"
          fi
          mv "$STAGE" "$REL"
          echo "unpacked $SHA"
          EOF

      - name: Activate, smoke test, auto-rollback on failure
        env:
          HOST: ${{ secrets.ORDER_ROUTER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ORDER_ROUTER_DEPLOY_USER }}
          SMOKE_KEY: ${{ secrets.ORDER_ROUTER_SMOKE_API_KEY }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${HOST}" \
            BASE="${BASE}" PORT="${PORT}" SERVICE="${SERVICE}" EXTRA_SERVICES="${EXTRA_SERVICES}" \
            SHA="${SHA}" SMOKE_KEY="${SMOKE_KEY}" 'bash -se' <<'EOF'
          set -e
          SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          REL="$BASE/releases/$SHA"
          [ -d "$REL" ] || { echo "::error::$REL was never unpacked"; exit 1; }
          PREV="$(readlink -f "$BASE/current" 2>/dev/null || true)"
          if [ "$PREV" = "$REL" ]; then
            # Re-deploying the SHA that is already live: `current` and the new release are the same
            # PATH, so recording it as `previous` would leave both symlinks on the same directory
            # and make the rollback job a no-op that reports success while the bad build stays up.
            # Fall back to whatever `previous` already points at, and to "no target" if that is the
            # same directory too — a rollback that cannot move must say so rather than lie.
            PREV="$(readlink -f "$BASE/previous" 2>/dev/null || true)"
            [ "$PREV" = "$REL" ] && PREV=""
          fi

          activate() {
            # Symlink swap via mv -T is atomic: there is no instant where `current` does not exist,
            # so a deploy interrupted here leaves a working tree rather than a missing one.
            ln -sfn "$1" "$BASE/.current.tmp"
            mv -Tf "$BASE/.current.tmp" "$BASE/current"
            $SUDO systemctl restart "$SERVICE"
            for extra in $EXTRA_SERVICES; do
              # Stateless (MCP/web): restarting them is free, and skipping one that is not
              # installed keeps this file honest about a box whose unit set may differ.
              $SUDO systemctl list-unit-files "$extra.service" >/dev/null 2>&1 \
                && $SUDO systemctl restart "$extra" || true
            done
          }

          # A restart rebuilds the entire order-book cache and degrades /route for minutes, so the
          # cheap, deterministic assertions run first and /route gets a long window of its own.
          smoke() {
            local body code
            for i in $(seq 1 60); do
              curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health" 2>/dev/null \
                | grep -q '"status":"ok"' && break
              sleep 2
            done
            body=$(curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health") \
              || { echo "smoke: /health not answering"; return 1; }
            echo "$body" | grep -q '"status":"ok"' || { echo "smoke: /health not ok: $body"; return 1; }
            # Proves the NEW process is the one answering, not a survivor of a failed restart.
            echo "$body" | grep -qE '"uptimeSec":[0-9]{1,3}(\.|,|})' \
              || { echo "smoke: the service did not restart ($body)"; return 1; }

            # LIVENESS is not READINESS. /health answers 200 from the first millisecond of boot,
            # so the loop above proves only that a process exists; /route is unanswerable until the
            # book cache has warmed, and until then live traffic reaching this process gets a
            # confident 200 that says "no route". /ready is the endpoint that knows the difference
            # (503 while freshCount < minFreshBooksForReady) and nothing consumed it. Gate here, so
            # the degraded window is a state the deploy waits out rather than one it serves through.
            for i in $(seq 1 60); do   # up to 5 min for the book cache to warm
              curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/ready" 2>/dev/null \
                | grep -q '"status":"ready"' && break
              sleep 5
            done
            curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/ready" 2>/dev/null \
              | grep -q '"status":"ready"' \
              || { echo "smoke: /ready never reported ready — the process is up but cannot route"; \
                   return 1; }

            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/symbols")
            [ "$code" = 401 ] || { echo "smoke: unauthenticated /symbols gave $code, want 401"; return 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $SMOKE_KEY" \
              "http://127.0.0.1:${PORT}/symbols")
            [ "$code" = 200 ] || { echo "smoke: authenticated /symbols gave $code, want 200"; return 1; }

            # The identity assertion, on the box, before anything is promoted or cleaned up: the
            # commit the process reports must be the commit this run built.
            body=$(curl -fsS --max-time 5 -H "x-api-key: $SMOKE_KEY" "http://127.0.0.1:${PORT}/version") \
              || { echo "smoke: /version not answering"; return 1; }
            echo "$body" | grep -q "\"commit\":\"$SHA\"" \
              || { echo "smoke: /version reports the wrong commit, want $SHA, got $body"; return 1; }

            for i in $(seq 1 60); do   # up to 5 min for the book cache to warm
              body=$(curl -s -H "x-api-key: $SMOKE_KEY" \
                "http://127.0.0.1:${PORT}/route?from=USDT&to=BTC&amountOut=0.001&strategy=split_optimal")
              echo "$body" | grep -q '"legs":\[{' && { echo "smoke: OK"; return 0; }
              sleep 5
            done
            echo "smoke: /route never returned legs: $body"; return 1
          }

          # Recorded BEFORE the swap so the rollback job (and a human at 3am) has a known-good
          # target that does not depend on reading this run's logs.
          if [ -n "$PREV" ] && [ -d "$PREV" ]; then
            ln -sfn "$PREV" "$BASE/.previous.tmp"
            mv -Tf "$BASE/.previous.tmp" "$BASE/previous"
          fi

          # Called in a condition so `set -e` cannot abort the run between the symlink swap and the
          # rollback branch — a failed restart is exactly when the rollback is needed most.
          if ! activate "$REL"; then
            echo "::error::activation returned non-zero (systemctl restart failed?)"
          fi
          if smoke; then
            # Keep the last 5 releases: enough to roll back past a bad one, few enough to not fill
            # a shared 7.5 GB box with node_modules trees. `.superseded` trees left by a same-SHA
            # redeploy are matched by the glob and age out with everything else.
            ls -1dt "$BASE"/releases/* | tail -n +6 | xargs -r rm -rf
            # Staging directories are dot-prefixed, so the glob above never sees them. Any that
            # survive are from a run that died between unpacking and the swap; this deploy has
            # already moved its own into place, and deploys are serialised, so all of them are dead.
            rm -rf "$BASE"/releases/.incoming-*
            echo "deployed $SHA"
          else
            echo "::error::smoke test failed — rolling back to ${PREV:-<none>}"
            $SUDO journalctl -u "$SERVICE" -n 60 --no-pager || true
            if [ -n "$PREV" ] && [ -d "$PREV" ]; then
              activate "$PREV" || echo "::error::the rollback restart also returned non-zero"
              for i in $(seq 1 30); do
                curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/health" 2>/dev/null && break
                sleep 2
              done
              echo "rolled back to $PREV"
            else
              echo "::error::no previous release to roll back to — the service may be down"
            fi
            exit 1
          fi
          EOF

  # ---------------------------------------------------------------------------------------------
  # The assertions that matter: run against the REAL deployment, through nginx and TLS, exactly as a
  # customer reaches it. The on-box smoke above proves the process came up; this proves the service
  # is correct end to end — and, first of all, that the code answering is the code just pushed.
  #
  # Same script a human runs by hand (order-router/scripts/live-integration.mjs). CI is not a
  # privileged caller here: it passes the same two env vars and gets the same output.
  # ---------------------------------------------------------------------------------------------
  live-integration:
    needs: [ deploy, deploy-gate ]
    # Same single-sourced gate as `deploy`; see the `deploy-gate` job.
    if: needs.deploy-gate.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What this job learned, as distinct from whether it passed. `rollback` keys on this rather than
    # on the job result: a missing, rotated or revoked ORDER_ROUTER_SMOKE_API_KEY fails every
    # authenticated assertion here, which looked identical to "the release is bad" and cost a
    # healthy production release a rollback and a second restart — two full book-cache rebuilds —
    # because a secret had expired.
    outputs:
      verdict: ${{ steps.live.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Live integration tests against the deployed service
        # No `npm ci`: the script uses nothing but Node built-ins, on purpose — a post-deploy check
        # that needs a dependency tree can fail for reasons that have nothing to do with the deploy.
        id: live
        env:
          # Public URL, not a secret: this is the address customers use. Deliberately NOT the
          # loopback port — going through nginx is what makes a broken proxy config a failed deploy.
          ROUTER_BASE_URL: https://docs.ccxt.com/router/api
          ROUTER_API_KEY: ${{ secrets.ORDER_ROUTER_SMOKE_API_KEY }}
          # The whole point. A deploy that silently no-ops answers every other assertion here
          # exactly like a successful one; only this fails.
          ROUTER_EXPECT_COMMIT: ${{ github.sha }}
        # Exit 2 is the script's documented "misconfigured" code (see scripts/live-integration.mjs):
        # no URL/key, or a key the deployment rejects while authenticating everything else
        # correctly. The run still goes red — a check that cannot run is not a pass — but it is
        # recorded as `misconfigured`, and `rollback` refuses to touch the box on that verdict.
        # The empty-secret case is caught before the script runs so the failure names the secret.
        run: |
          if [ -z "$ROUTER_API_KEY" ]; then
            echo "verdict=misconfigured" >> "$GITHUB_OUTPUT"
            echo "::error::ORDER_ROUTER_SMOKE_API_KEY is empty — the post-deploy checks cannot run."
            echo "::error::This says NOTHING about the release just deployed; it is not rolled back."
            exit 1
          fi
          set +e
          node scripts/live-integration.mjs
          code=$?
          set -e
          case "$code" in
            0) verdict=passed ;;
            2) verdict=misconfigured ;;
            *) verdict=failed ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = misconfigured ]; then
            echo "::error::the post-deploy checks were misconfigured (exit 2), not failed — the"
            echo "::error::deployed release is left in place. Check ORDER_ROUTER_SMOKE_API_KEY."
          fi
          exit $code

  # ---------------------------------------------------------------------------------------------
  # The deployed build is wrong even though it started cleanly: put the previous release back.
  # Runs only when deploy succeeded and live-integration failed ON ITS ASSERTIONS — a failed deploy
  # has already rolled itself back, and a cancelled run must not touch the box at all.
  #
  # `verdict == 'failed'`, not `result == 'failure'`: the job also goes red when the checks could
  # not run at all (missing, rotated or revoked ORDER_ROUTER_SMOKE_API_KEY). Rolling back on that
  # reverts a release nothing is known to be wrong with and restarts the router twice, each restart
  # rebuilding the whole book cache — an outage caused entirely by an expired secret.
  #
  # The deliberate cost: a live-integration job that dies before publishing a verdict (runner death,
  # a cancelled run, the 15-minute job timeout) no longer triggers an automatic rollback. The script
  # bounds itself well inside that timeout, so those are infrastructure failures — the class this
  # exists to stop rolling back on. The run is still red; roll back by hand if the deploy is suspect.
  # ---------------------------------------------------------------------------------------------
  rollback:
    needs: [ deploy, live-integration, deploy-gate ]
    if: >-
      always() &&
      needs.deploy-gate.outputs.should-deploy == 'true' &&
      needs.deploy.result == 'success' &&
      needs.live-integration.result == 'failure' &&
      needs.live-integration.outputs.verdict == 'failed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Same group as `deploy`: this job repoints the same symlink and restarts the same unit, so it
    # must never run while a deploy is in flight.
    concurrency:
      group: order-router-deploy
      cancel-in-progress: false
    env:
      BASE: /opt/order-router
      PORT: '8080'
      SERVICE: order-router
    steps:
      # REQUIRED even though this job builds nothing: the workflow-level
      # `defaults.run.working-directory: order-router` applies here too, and a `run:` step whose
      # working directory does not exist fails before bash starts ("An error occurred trying to
      # start process '/usr/bin/bash' with working directory ..."). Without this checkout every
      # step below — including the rollback itself — dies at the OS level and the bad build stays
      # live while the run stays red for the earlier failure.
      - uses: actions/checkout@v4

      - name: Configure SSH (pinned host key)
        env:
          SSH_KEY: ${{ secrets.ORDER_ROUTER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORDER_ROUTER_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll back to the previous release
        env:
          HOST: ${{ secrets.ORDER_ROUTER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ORDER_ROUTER_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${HOST}" \
            BASE="${BASE}" PORT="${PORT}" SERVICE="${SERVICE}" 'bash -se' <<'EOF'
          set -e
          SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          PREV="$(readlink -f "$BASE/previous" 2>/dev/null || true)"
          if [ -z "$PREV" ] || [ ! -d "$PREV" ]; then
            echo "::error::no $BASE/previous to roll back to — the bad build is STILL LIVE, fix by hand"
            exit 1
          fi
          ln -sfn "$PREV" "$BASE/.current.tmp"
          mv -Tf "$BASE/.current.tmp" "$BASE/current"
          $SUDO systemctl restart "$SERVICE" \
            || echo "::error::systemctl restart returned non-zero during rollback"
          for i in $(seq 1 60); do
            curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health" 2>/dev/null \
              | grep -q '"status":"ok"' && break
            sleep 2
          done
          curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health" | grep -q '"status":"ok"' \
            || { echo "::error::rolled back but /health is still not ok"; \
                 $SUDO journalctl -u "$SERVICE" -n 60 --no-pager || true; exit 1; }
          echo "rolled back to $PREV"
          EOF

      - name: Fail the run
        # The rollback succeeding does not make the run green: a commit that failed its live tests
        # is not deployed, and the build must say so.
        run: |
          echo "::error::live integration tests failed after deploy — rolled back to the previous release"
          exit 1
