name: C++
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} · {1}', github.ref_name, github.sha) }}

env:
  HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

on:
  workflow_dispatch:
  push:
    branches: [ main, master, cpp-lang ]
  pull_request:
    branches: [ main, master, cpp-lang ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[Automated changes]') }}

jobs:
  build:
    runs-on: [ self-hosted, linux, x64, cpp ]
    if: ${{ !startsWith(github.event.head_commit.message, 'Update changelog for') && !startsWith(github.event.head_commit.message, '[Automated changes]') }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        clean: false
    - name: Skip Automated Push Commits
      id: check_commit
      run: |
        if [[ "$HEAD_COMMIT_MESSAGE" == *"[Automated changes]"* ]]; then
          echo "This commit was made by the action. Skipping."
          exit 0
        fi
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install npm dependencies
      run: npm ci --include=dev
    - name: ccache
      # toolchain (cmake, ninja, lld, ccache, dev libs) is baked into the runner's cpp layer;
      # the cache dir persists across ephemeral jobs on the runner
      run: |
        echo "CCACHE_DIR=/mnt/cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
    - name: Emit implicit API
      run: npm run emitAPI -- --cpp
    - name: Transpile everything (base, tests, all exchanges)
      run: npm run transpileCpp -- --all --force
    - name: Transpile pro (ws) tier
      run: npm run transpileCpp -- --pro --force
    - name: Configure
      # ccache as compiler launcher turns a warm CI into a seconds-long build;
      # lld as linker keeps the final whole-archive link inside runner memory
      run: |
        # clean:false reuses the workspace; a previous root-owned build dir
        # breaks ar's archive update with a misreported 'reason: Success'
        if [ "$(id -u)" -ne 0 ]; then
          sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
        fi
        cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
    - name: Build (parallel compile)
      run: cmake --build cpp/build --parallel 4
    - name: Base tests
      run: npm run test-base-rest-cpp
    - name: binance smoke test
      run: cpp/build/ccxt-smoke-binance
    - name: typed layer smoke test
      run: cpp/build/ccxt-typed-smoke
    - name: Static request tests (all exchanges)
      run: cpp/build/ccxt-tests all --requestTests
    - name: Static response tests (all exchanges)
      run: cpp/build/ccxt-tests all --responseTests

  live-tests:
    runs-on: [ self-hosted, linux, x64, cpp ]
    needs: build
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        clean: false
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Workspace ownership
      # reuses the build job's workspace (cpp/build + node_modules) on this
      # runner; a previous root-owned tree breaks the rerun, so fix ownership
      run: |
        if [ "$(id -u)" -ne 0 ]; then
          sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
        fi
    - name: binance live tests (public endpoints)
      run: node run-tests binance --cpp
