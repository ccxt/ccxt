name: Rust
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} · {1}', github.ref_name, github.sha) }}

env:
  HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Update changelog for') && !startsWith(github.event.head_commit.message, '[Automated changes]') && !contains(github.event.head_commit.message, 'Merge branch ''master'' of https://github.com/ccxt/ccxt') }}
    timeout-minutes: 120
    steps:
      - name: Generate App token
        if: github.ref == 'refs/heads/master'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          clean: false
          token: ${{ github.ref == 'refs/heads/master' && steps.app-token.outputs.token || github.token }}
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            examples/rust
          cache-all-crates: true
      - name: Setup Node.js
        uses: actions/setup-node@v3
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Determine modified files
        run: ./build/utils/init_actions.sh
      - name: Check tsc version
        run: tsc --version
      - name: Install tsx
        run: npm install -g tsx
      - name: export exchanges
        run: npm run export-exchanges
      - name: Generate implicit API
        run: npm run emitAPI
      - name: Transpile To Rust
        if: env.important_modified == 'true'
        run: tsx build/rustTranspiler.ts && tsx build/rustTranspiler.ts --ws
      - name: Transpile to Rust (specific)
        if: env.important_modified == 'false'
        run: |
          read -r -a files <<<"$(printf '%s %s' "${{ env.rest_files }}" "${{ env.ws_files }}" | xargs)"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files to process; building the reference venue only."
            tsx build/granular-rust-build.ts binance
          else
            echo "Files to process: ${files[*]}"
            tsx build/granular-rust-build.ts "${files[@]}"
          fi
      - name: Generate Rust typed wrappers
        run: npm run emitRustTyped
      - name: Build
        run: npm run buildRust
      - name: Check ccxt package (isolated feature sets)
        run: |
          cargo check --manifest-path rust/ccxt-base/Cargo.toml --no-default-features
          cargo check --manifest-path rust/ccxt-base/Cargo.toml --all-features
      - name: Clippy (ccxt lib)
        run: |
          rustup component add clippy
          cargo clippy --manifest-path rust/ccxt-base/Cargo.toml --features transpiled-base -- -D warnings
      - name: Build Rust examples
        if: github.ref == 'refs/heads/master' && env.important_modified == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: cargo build --manifest-path examples/rust/Cargo.toml --bins
      - name: Build tests
        run: npm run buildRust --tests
      - name: Cargo test
        if: env.important_modified == 'true'
        run: |
          cargo test --jobs 1 --manifest-path rust/ccxt-base/Cargo.toml --features transpiled-base
          cargo test --jobs 1 --manifest-path rust/Cargo.toml -p ccxt_tests --bin ti-rust cargo_test_gate
      - name: Run Base Tests
        if: env.important_modified == 'true'
        run: npm run test-base-rest-rust
      - name: Run Base Ws Tests
        if: env.important_modified == 'true'
        run: npm run test-base-ws-rust
      - name: Run Id Tests
        if: env.important_modified == 'true'
        run: npm run id-tests-rust
      - name: Request tests
        if: env.important_modified == 'true'
        run: npm run request-rust
      - name: Request tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run request-rust -- $exchange
          done
      - name: Response Tests
        if: env.important_modified == 'true'
        run: npm run response-rust
      - name: Response tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run response-rust -- $exchange
          done
      - name: WS static tests
        if: env.important_modified == 'true'
        run: npm run ws-tests-rust
      - name: WS static tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
          for exchange in $cleaned_ws_files; do
            npm run ws-tests-rust -- $exchange
          done
      - name: Prediction request tests
        if: env.prediction_modified == 'true'
        run: npm run request-rust-prediction
      - name: Prediction response tests
        if: env.prediction_modified == 'true'
        run: npm run response-rust-prediction
      - name: Upload Rust Files
        uses: actions/upload-artifact@v4
        with:
          name: rust-files
          path: rust/
      - name: Upload shared_env.txt
        uses: actions/upload-artifact@v4
        with:
            name: shared_env
            path: shared_env.txt

      - name: Get App bot user ID
        if: github.ref == 'refs/heads/master'
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          id=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).id")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Push Rust changes to master
        if: github.ref == 'refs/heads/master' && github.actor != 'ccxt-release[bot]'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add rust/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[Automated changes] Rust files"

          git fetch origin master
          git rebase --autostash origin/master
          git push origin HEAD:master

  live-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || cargo --version
      - name: Download shared_env
        uses: actions/download-artifact@v4
        with:
          name: shared_env
      - name: Download Rust Binary
        uses: actions/download-artifact@v4
        with:
          name: rust-files
          path: rust/
      - name: Restore shared_env
        run: ./build/utils/restore_shared_env.sh
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Export exchanges
        run: npm run export-exchanges
      - name: Build
        run: npm run buildRust
      - name: Live tests
        if: env.important_modified == 'true'
        run: ./run-tests-simul.sh --rust
      - name: Live tests (specific)
        if: env.important_modified == 'false'
        run: ./run-tests-simul.sh --rust "${{ env.rest_files }}" "${{ env.ws_files }}"
