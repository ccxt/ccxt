name: Rust
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} · {1}', github.ref_name, github.sha) }}

env:
  HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  # Skip debuginfo in dev builds: the generated `ccxt` crate is one ~31 MB /
  # 300+ file compilation unit, and debuginfo pushes rustc's peak memory past
  # what a 16 GB GitHub-hosted runner has — the OS then OOM-kills the runner
  # agent ("The runner has received a shutdown signal" / exit 143 mid
  # `Compiling ccxt`). Debuginfo is useless in CI; [profile.release] in
  # rust/Cargo.toml is unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # `cargo test` recompiles `ccxt` under the `test` profile, which does NOT
  # inherit the `dev` override above — so debuginfo (and the same OOM/exit-143
  # mid-`Compiling ccxt`) comes back on the `cargo test` steps unless the test
  # profile is pinned to no-debug too.
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Serialize compilation across crates. The generated `ccxt` crate is a single
  # ~12 GB (rustc RSS) compilation unit on its own; with default parallelism
  # cargo runs it concurrently with the tail of the dependency graph, and the
  # combined RSS (~14 GB, measured) tips the 16 GB runner into an OOM kill mid
  # `Compiling ccxt`. `--jobs 1` makes the build's peak the single largest crate
  # rather than a sum of overlapping rustc processes. (The WS `pro` venues and
  # the typed-wrapper layer were also split into the sibling `ccxt-pro` /
  # `ccxt-typed` crates so no single rustc holds all of them at once.)
  CARGO_BUILD_JOBS: "1"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Update changelog for') && !startsWith(github.event.head_commit.message, '[Automated changes]') && !contains(github.event.head_commit.message, 'Merge branch ''master'' of https://github.com/ccxt/ccxt') }}
    timeout-minutes: 120
    steps:
      - name: Generate App token
        if: github.ref == 'refs/heads/master'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CCXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCXT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          clean: false
          token: ${{ github.ref == 'refs/heads/master' && steps.app-token.outputs.token || github.token }}
      # The self-hosted runners don't ship a Rust toolchain (unlike GitHub-hosted
      # VMs). Install rustup + stable if missing — no-op on reruns since the
      # runner's home dir persists. Must run before Swatinem/rust-cache, which
      # needs `rustc -V` for its cache key.
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || cargo --version
      # - uses: taiki-e/cache-cargo-install-action@v3
      #   with:
      #     tool: cargo-hack
      # Cache compiled third-party deps + the cargo registry across runs. The
      # generated `ccxt` crate changes every run (re-transpiled), so it always
      # recompiles — but reqwest/k256/rsa/ed25519/chrono/... are the slow part
      # and don't change. Without this every step (buildRust, the separate
      # examples manifest, the test build) rebuilds the whole dep tree from
      # scratch, which after the upstream merge grew the crate pushed the job
      # past its timeout (SIGTERM/exit 143 mid-compile). Cache both manifests'
      # target dirs since the examples are a standalone workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            examples/rust
          cache-all-crates: true
      - name: Setup Node.js
        uses: actions/setup-node@v3
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Determine modified files
        run: ./build/utils/init_actions.sh
      - name: Check tsc version
        run: tsc --version
      - name: Install tsx
        run: npm install -g tsx
      - name: export exchanges
        run: npm run export-exchanges
      - name: Generate implicit API
        run: npm run emitAPI # if we emit go only, the implicit API will be problematic for new exchanges
      - name: Transpile To Rust
        if: env.important_modified == 'true'
        run: tsx build/rustTranspiler.ts #&& tsx build/rustTranspiler.ts --ws
      - name: Transpile to Rust (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          # for exchange in $cleaned_rest_files; do
          #   tsx build/rustTranspiler.ts -- $exchange
          # done
        # run : |
        #   # cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
        #   # cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
        #   # # echo "Cleaned files: $cleaned_rest_files"
        #   # # tsx build/granular-go-build.ts $cleaned_rest_files
        #   # if [ -n "$cleaned_rest_files" ]; then
        #   #   echo "Cleaned files: $cleaned_rest_files"
        #   #   tsx build/granular-go-build.ts $cleaned_rest_files
        #   # else
        #   #   echo "No rest files to process; skipping."
        #   # fi
        #   # cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
        #   # if [ -n "$cleaned_ws_files" ]; then
        #   #   echo "Cleaned files: $cleaned_ws_files"
        #   #   tsx build/granular-go-build.ts $cleaned_ws_files
        #   # else
        #   #   echo "No websocket files to process; skipping."
        #   # fi
        #   read -r -a files <<<"$(printf '%s %s' "${{ env.rest_files }}" "${{ env.ws_files }}" | xargs)"
        #   if [ "${#files[@]}" -eq 0 ]; then
        #     echo "No files to process; skipping."
        #     exit 0
        #   fi
        #   echo "Files to process: ${files[*]}"
        #   tsx build/granular-go-build.ts "${files[@]}"
      # - name: Install dependencies
      #   run: cd go && go get ./ccxt && cd ..
      - name: Build
        run: npm run buildRust
      # Check the `ccxt` package in isolation, not only as part of the workspace:
      # Cargo feature unification from ccxt_tests would otherwise mask a broken
      # default/no-default-features consumer build (review P0-A).
      - name: Check ccxt package (isolated feature sets)
        run: |
          cargo check --manifest-path rust/ccxt/Cargo.toml --no-default-features
          cargo check --manifest-path rust/ccxt/Cargo.toml --all-features
      # Clippy on the hand-written runtime with the noisy style/complexity/perf
      # groups allowed but `correctness`/`suspicious` denied (review #11).
      # Generated files self-allow clippy::all, so this gates the code that
      # actually needs review.
      - name: Clippy (ccxt lib)
        run: |
          rustup component add clippy
          cargo clippy --manifest-path rust/ccxt/Cargo.toml --features transpiled-base -- -D warnings
      # Build the standalone consumer examples so they can't drift from the API
      # (review #10).
      - name: Build Rust examples
        run: cargo build --manifest-path examples/rust/Cargo.toml --bins
      # - name: Build Ws
      #   run: npm run buildRust --ws
      - name: Build tests
        run: npm run buildRust --tests
      # Ordinary `cargo test` gate (review #8): the ccxt lib unit tests plus the
      # hand-written base REST/WS + language-specific suites wired as #[test]s.
      # `--jobs 1`: unlike `cargo build` (which compiles the ~31 MB / 300+ file
      # generated `ccxt` crate ONCE), `cargo test` compiles it twice — as the lib
      # AND as the `--test` harness binary — and cargo runs those concurrently by
      # default, so two rustc processes each holding the whole crate's MIR blow
      # past the 16 GB runner and it OOM-kills mid-compile (exit 143), even with
      # debuginfo already off. Serialize compilation so only one rustc holds the
      # crate at a time (the dev build proves a single one fits).
      - name: Cargo test
        run: |
          cargo test --jobs 1 --manifest-path rust/ccxt/Cargo.toml --features transpiled-base
          cargo test --jobs 1 --manifest-path rust/Cargo.toml -p ccxt_tests --bin ti-rust cargo_test_gate
      # - name: Test GO Types
      #   if: env.important_modified == 'true'
      #   run: npm run test-types-go
      - name: Run Base Tests
        if: env.important_modified == 'true'
        run: npm run test-base-rest-rust
      - name: Run Base Ws Tests
        if: env.important_modified == 'true'
        run: npm run test-base-ws-rust
      - name: Run Id Tests
        if: env.important_modified == 'true'
        run: npm run id-tests-rust
      - name: Request tests
        if: env.important_modified == 'true'
        run: npm run request-rust
      - name: Request tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run request-rust -- $exchange
          done
      - name: Response Tests
        if: env.important_modified == 'true'
        run: npm run response-rust
      - name: Response tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_rest_files=$(echo ${{ env.rest_files }} | tr -s ' ')
          for exchange in $cleaned_rest_files; do
            npm run response-rust -- $exchange
          done
      # WS static suite: replays recorded frames from ts/src/test/static/ws/
      # through the pro Cores' handle_message over an offline mock transport and
      # asserts the parsed structures / sent subscribe frames. Mirrors the
      # request/response static steps above but for the watch* methods.
      - name: WS static tests
        if: env.important_modified == 'true'
        run: npm run ws-tests-rust
      - name: WS static tests (specific)
        if: env.important_modified == 'false'
        run: |
          cleaned_ws_files=$(echo ${{ env.ws_files }} | tr -s ' ')
          for exchange in $cleaned_ws_files; do
            npm run ws-tests-rust -- $exchange
          done
      # Prediction-market static suites: read fixtures from
      # ts/src/test/static/{request,response}/prediction/ and run them through
      # the prediction Cores (kalshi/limitless/myriad/polymarket/hyperliquid).
      # Mirrors the prediction steps in js/py/php/cs/go/java workflows.
      - name: Prediction request tests
        if: env.prediction_modified == 'true'
        run: npm run request-rust-prediction
      - name: Prediction response tests
        if: env.prediction_modified == 'true'
        run: npm run response-rust-prediction

      # - name: Upload Go Files
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: go-files
      #     path: go/
      - name: Upload Rust Files
        uses: actions/upload-artifact@v4
        with:
          name: rust-files
          path: rust/
      - name: Upload shared_env.txt
        uses: actions/upload-artifact@v4
        with:
            name: shared_env
            path: shared_env.txt

      - name: Get App bot user ID
        if: github.ref == 'refs/heads/master'
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          id=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).id")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Push Rust changes to master
        if: github.ref == 'refs/heads/master' && github.actor != 'ccxt-release[bot]'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add rust/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[Automated changes] Rust files"

          git fetch origin master
          git rebase --autostash origin/master
          git push origin HEAD:master

  live-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as the build job: the self-hosted runners don't ship a Rust
      # toolchain, so `npm run buildRust` (cargo) below needs rustup installed
      # first. No-op on GitHub-hosted VMs / reruns where cargo already exists.
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || cargo --version
      - name: Download shared_env
        uses: actions/download-artifact@v4
        with:
          name: shared_env
      # - name: Download Rust Files
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: rust-files
      #     path: rust/
      # - uses: actions/checkout@v4
      - name: Download Rust Binary
        uses: actions/download-artifact@v4
        with:
          name: rust-files
          path: rust/
      - name: Restore shared_env
        run: ./build/utils/restore_shared_env.sh
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Export exchanges
        run: npm run export-exchanges
      # - name: Install dependencies
      #   run: go get ./go/v4
      # - name: Build
      #   run: go build ./go/v4
      # - name: Build tests
      #   run: go build ./go/tests/main.go
      # - name: Adjust permissions
      #   run: cd go && chmod +x main
      - name: Build
        run: npm run buildRust
      - name: Live tests
        if: env.important_modified == 'true'
        run: ./run-tests-simul.sh --rust
      - name: Live tests (specific)
        if: env.important_modified == 'false'
        run: ./run-tests-simul.sh --rust "${{ env.rest_files }}" "${{ env.ws_files }}"


